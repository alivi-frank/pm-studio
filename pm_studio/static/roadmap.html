<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PM Studio — Roadmap</title>
<link rel="stylesheet" href="/static/nav.css" />
<script src="/static/nav.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --column: #f3f2ef;
    --ink-primary: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --border: rgba(11, 11, 11, 0.10);
    --hairline: rgba(11, 11, 11, 0.06);
    --hover: rgba(11, 11, 11, 0.04);
    --status-pending: #898781;
    --status-in-progress: #2a78d6;
    --status-done: #0ca30c;
    --suggestion-bg: rgba(184, 134, 11, 0.10);
    --suggestion-border: #b8860b;
    --accent: #2a78d6;
    --accent-fg: #ffffff;
    --danger: #d03b3b;
    --danger-bg: rgba(208, 59, 59, 0.10);
    --today: #d03b3b;
    /* One hue per kind of row in the tree. The glyph SHAPE is the real signal - the
       board has to read correctly in greyscale and to a colour-blind viewer - and the
       tint is only what makes a column of them scannable at a glance. */
    --kind-product: #4a63d0;
    --kind-initiative: #7a4fc0;
    --kind-project: #1f8a7c;
    /* The vertical guide a section drops through everything it contains. Heavier than
       --hairline: it is the one thing carrying the nesting. */
    --rail: rgba(11, 11, 11, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19;
      --page: #0d0d0d;
      --column: #161615;
      --ink-primary: #ffffff;
      --ink-secondary: #c3c2b7;
      --ink-muted: #898781;
      --border: rgba(255, 255, 255, 0.10);
      --hairline: rgba(255, 255, 255, 0.07);
      --hover: rgba(255, 255, 255, 0.05);
      --status-pending: #898781;
      --status-in-progress: #3987e5;
      --status-done: #0ca30c;
      --suggestion-bg: rgba(212, 167, 44, 0.10);
      --suggestion-border: #d4a72c;
      --accent: #3987e5;
      --accent-fg: #ffffff;
      --danger: #e66767;
      --danger-bg: rgba(230, 103, 103, 0.16);
      --today: #e66767;
      --kind-product: #7d94f5;
      --kind-initiative: #b087e8;
      --kind-project: #35b3a1;
      --rail: rgba(255, 255, 255, 0.17);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  /* No page <header>. The title was a restatement of the tab already lit in the nav,
     and the toggles now live in the nav's own controls slot - together that is ~90px of
     vertical space handed back to the board itself. */
  main {
    max-width: 1440px;
    margin: 0 auto;
    padding: 14px 20px 40px;
  }

  /* ---- groups (one per product, or one per initiative) ---------------------------
     A rule and a heading rather than a card: three nested rounded boxes (section >
     column > card) spent most of their width on their own padding. */
  /* Top-level products are the coarsest cut the page makes, so they get real air
     between them - at 8px a product heading read as one more row of the product above
     it rather than as the start of its own board. */
  section.group { margin-bottom: 20px; }
  section.group:last-child { margin-bottom: 0; }
  .group-head {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    padding: 7px 4px;
    border: 0;
    border-bottom: 1px solid var(--border);
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .group-head:hover { background: var(--hover); }
  /* Sized in its own right rather than shrunk relative to the heading: this glyph is
     the only thing on the row that says it opens, so it has to be findable before you
     have thought to look for it. Boxed and centred so the rotation pivots on the
     glyph rather than swinging it sideways. */
  .group-head .chevron {
    flex: 0 0 auto;
    width: 16px;
    font-size: 0.95em;
    line-height: 1;
    text-align: center;
    color: var(--ink-secondary);
    transition: transform 0.15s ease;
  }
  section.group.collapsed .chevron { transform: rotate(-90deg); }
  .group-head h2 {
    margin: 0;
    font-size: 1.0em;
    font-weight: 660;
    letter-spacing: -0.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .group-head .tally {
    display: flex;
    gap: 8px;
    margin-left: auto;
    font-size: 0.76em;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .group-head .tally .live { color: var(--status-in-progress); font-weight: 600; }
  section.group.collapsed .group-body { display: none; }
  /* Everything a section contains - its projects, its triage, its sub-products - hangs
     off ONE rail dropped from under the section's own chevron, at every depth. Nesting
     you can follow with your eye down a single line, rather than nesting you have to
     infer from four different box paddings. 11px puts the rail under the middle of the
     16px chevron (4px of head padding + half of it). */
  .group-body {
    padding-top: 9px;
    margin-left: 11px;
    padding-left: 14px;
    border-left: 1px solid var(--rail);
  }

  /* ---- sub-products: a section nested inside its parent's body -------------------
     A child product is a board in its own right, so it gets the same heading, tally and
     fold as any other section - only indented, and hung off a rule that runs down its
     parent. A rule rather than another card for the reason the sections themselves are
     rules: a box inside a box inside a box spends the width on padding, and the one
     thing the indent has to say is "these belong to the heading above". */
  /* The indent itself is the parent body's rail, which the sub-section sits inside
     along with the parent's own project rows - a child product IS a sibling of those
     rows, and the heading, the glyph and the fold are what say it is a board and they
     are not. What is left here is only the spacing between them. */
  .subgroups { display: flex; flex-direction: column; gap: 14px; margin: 16px 0 0; }
  section.group.sub { margin-bottom: 0; }
  section.group.sub > .group-head h2 { font-size: 0.9em; font-weight: 620; }
  /* Dashed, so the depth is legible at a glance even when a parent's own rows are
     folded away and two headings end up adjacent. */
  section.group.sub > .group-head { border-bottom-style: dashed; }
  section.group.sub > .group-body { padding-top: 7px; }
  /* The one tally entry that is about work NOT in this section - italic so it doesn't
     read as another of the section's own counts. */
  .group-head .tally .nested,
  .gantt-group .tally .nested { font-style: italic; }

  /* ---- the kind glyphs -----------------------------------------------------------
     Four different kinds of thing are drawn as rows of the same shape - product,
     sub-product, initiative, project - and until now the only thing telling them apart
     was type size, which stops working the moment a row is two levels deep or the list
     is long. Each row now leads with a glyph that says what it is: a box for a product,
     a flag for an initiative, a folder for a project, the same folder dashed and grey
     for the synthetic "No project" row. Shape first, colour second - the board still
     reads in greyscale. */
  .kind {
    flex: 0 0 auto;
    display: inline-flex;
    width: 14px;
    height: 14px;
    color: var(--kind-ink, var(--ink-muted));
  }
  .kind svg { width: 100%; height: 100%; display: block; }
  .kind-product { --kind-ink: var(--kind-product); }
  /* Same glyph as its parent, a size down: a sub-product is the same KIND of thing one
     level in, and saying that with the same shape is the point. */
  .kind-subproduct { --kind-ink: var(--kind-product); width: 12.5px; height: 12.5px; opacity: 0.9; }
  .kind-initiative { --kind-ink: var(--kind-initiative); }
  .kind-project { --kind-ink: var(--kind-project); width: 12.5px; height: 12.5px; }
  .kind-loose { --kind-ink: var(--ink-muted); width: 12.5px; height: 12.5px; }

  /* ---- the project row: what a section shows FIRST -------------------------------
     A section used to open straight onto every one of its changes, which is the right
     altitude for doing the work and the wrong one for reading the plan: twelve titles
     tell you what is being built, not whether the thing they add up to is on track.
     So the first level is one row per project - the unit the portfolio page actually
     plans in - carrying only what you can act on at that altitude (how much is done,
     how much is moving, what is late, when it runs). The changes are one click away,
     unchanged, inside it. */
  .projects { display: flex; flex-direction: column; gap: 3px; }
  .project {
    background: var(--surface);
    /* A hairline, not the full border: a dozen of these stacked under one heading were
       a dozen equally-loud boxes, and the thing that should be loud is the heading. The
       one that is OPEN gets the real border, because it is the one you are reading. */
    border: 1px solid var(--hairline);
    border-radius: 7px;
    overflow: hidden;
  }
  .project:hover { border-color: rgba(128, 128, 128, 0.32); }
  .project.open { border-color: var(--border); }
  .project-head {
    display: flex;
    align-items: center;
    gap: 7px;
    /* Wraps rather than crushes: on a narrow window the counts drop to their own line
       under the name instead of squeezing it down to two characters. */
    flex-wrap: wrap;
    width: 100%;
    padding: 7px 10px;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .project-head:hover { background: var(--hover); }
  .project-head .chevron {
    flex: 0 0 auto;
    width: 15px;
    font-size: 0.9em;
    line-height: 1;
    text-align: center;
    color: var(--ink-secondary);
    transition: transform 0.15s ease;
  }
  .project:not(.open) .project-head .chevron { transform: rotate(-90deg); }
  .project-name {
    min-width: 0;
    font-size: 0.86em;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Not a project anybody planned - it is where changes that fell out of the work model
     land. Set lighter than a real project row so it reads as the bucket it is. */
  .project-name.loose { font-weight: 500; color: var(--ink-secondary); }
  /* The row's own metadata sits left, next to the name it qualifies; the numbers are
     pushed right so every project in a section lines its counts up in one column. */
  .project-head .chip { flex: 0 0 auto; }
  .project-head .chip:not(:last-child)::after { content: none; }
  .project-stats {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    font-size: 0.74em;
    color: var(--ink-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .project-stats .live { color: var(--status-in-progress); font-weight: 600; }
  .project-body {
    display: none;
    padding: 8px 10px 10px;
    border-top: 1px solid var(--hairline);
  }
  .project.open .project-body { display: block; }
  .project-empty { font-size: 0.78em; color: var(--ink-muted); padding: 2px 0; }

  /* Shipped / in progress / pending, as a share of the project. Deliberately NOT the
     only signal: the counts beside it say the same thing in words, so the row reads
     correctly in greyscale and to a colour-blind viewer, and the meter is the glance
     version rather than the source of truth. The 2px gaps are page, not a border, so
     a 3% segment is still a visible segment. */
  .meter {
    display: flex;
    gap: 2px;
    flex: 0 0 auto;
    width: 84px;
    height: 5px;
  }
  .meter .seg { min-width: 2px; border-radius: 2px; }
  .meter .seg.done { background: var(--status-done); }
  .meter .seg.in_progress { background: var(--status-in-progress); }
  .meter .seg.pending { background: var(--status-pending); opacity: 0.45; }
  .meter .seg.empty { flex: 1; background: var(--border); }

  /* ---- lanes (the now / next / later subview) ---- */
  .lanes {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    align-items: start;
  }
  @media (max-width: 860px) { .lanes { grid-template-columns: 1fr; } }
  .lane {
    background: var(--column);
    border-radius: 8px;
    padding: 7px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .lane-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 3px 1px;
  }
  .lane-head h3 {
    margin: 0;
    font-size: 0.7em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-secondary);
  }
  .lane-head .n {
    font-size: 0.72em;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .add-btn {
    margin-left: auto;
    border: none;
    background: transparent;
    color: var(--ink-muted);
    font: inherit;
    font-size: 1em;
    line-height: 1;
    cursor: pointer;
    padding: 1px 4px;
    border-radius: 5px;
  }
  .add-btn:hover { color: var(--accent); background: var(--hover); }
  .lane-empty {
    color: var(--ink-muted);
    font-size: 0.75em;
    padding: 2px 3px 4px;
  }

  /* ---- the change card ------------------------------------------------------------
     Collapsed it is one line: a status dot, the title, and whatever metadata the change
     actually has. Every control the old always-open card showed (four selects and three
     buttons, on every card, at all times) is one click away in the same place instead -
     which is what took a card from ~140px to ~30px. */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .card:hover { border-color: rgba(128, 128, 128, 0.35); }
  .card-main {
    display: flex;
    align-items: baseline;
    gap: 7px;
    width: 100%;
    padding: 6px 8px;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .card-main:hover { background: var(--hover); }
  .card-title {
    flex: 1;
    min-width: 0;
    font-size: 0.86em;
    font-weight: 600;
    line-height: 1.35;
  }
  .card:not(.open) .card-title {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* Status as a dot on the left edge of the title, not a badge with a word next to it -
     the word cost a whole row on every card and the legend is one hover away. */
  .status-dot {
    flex: 0 0 auto;
    width: 7px;
    height: 7px;
    margin-top: 1px;
    border-radius: 50%;
    align-self: flex-start;
    transform: translateY(4px);
  }
  .status-dot.pending { border: 1.5px solid var(--status-pending); }
  .status-dot.in_progress { background: var(--status-in-progress); }
  .status-dot.done { background: var(--status-done); }
  @media (prefers-reduced-motion: no-preference) {
    .status-dot.in_progress { animation: pulse 1.6s ease-in-out infinite; }
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    padding: 0 8px 5px 22px;
  }
  .card-meta:empty { display: none; }
  /* Plain muted text separated by middots, not a row of filled pills: on a card that is
     now two lines tall, three pills outweighed the title they were annotating. Only the
     chips that mean something is WRONG get a fill. */
  .chip {
    font-size: 0.7em;
    line-height: 1.5;
    color: var(--ink-muted);
    white-space: nowrap;
    max-width: 26ch;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Trailing, not leading: when the row wraps, a dot left at the end of a line reads as
     "continues below", where a dot starting the next line reads as a bullet. Scoped to a
     card's metadata row - a section head's flags sit next to a tally pushed to the far
     right, where a separator would just dangle. */
  .card-meta .chip:not(:last-child)::after { content: "·"; margin-left: 5px; }
  .chip.warn {
    padding: 0 5px;
    border-radius: 4px;
    color: var(--suggestion-border);
    background: var(--suggestion-bg);
  }
  .chip.warn::after { content: none; }
  .chip.owner { color: var(--ink-secondary); }

  .card-body {
    display: none;
    padding: 2px 8px 8px 22px;
    border-top: 1px solid var(--hairline);
    margin-top: 2px;
  }
  .card.open .card-body { display: block; }
  /* Shared by the lane card's open body and the timeline row's detail panel - the two
     places a change's full text and controls appear. */
  .desc {
    font-size: 0.8em;
    color: var(--ink-secondary);
    line-height: 1.45;
    white-space: pre-wrap;
    margin: 6px 0;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  select.mini, input.mini {
    font: inherit;
    font-size: 0.75em;
    background: var(--page);
    color: var(--ink-primary);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 4px;
  }
  .date-field {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.75em;
    color: var(--ink-muted);
  }
  .date-field input.mini { font-size: 1em; }
  .controls button {
    font: inherit;
    font-size: 0.75em;
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: transparent;
    color: var(--ink-secondary);
    cursor: pointer;
  }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }
  .controls .del { margin-left: auto; }
  .controls .del:hover { border-color: var(--danger); color: var(--danger); }

  /* ---- cross-product suggestions awaiting triage ---- */
  .triage {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 10px;
  }
  .suggestion {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--suggestion-bg);
    border: 1px solid var(--suggestion-border);
    border-radius: 7px;
    padding: 6px 9px;
  }
  .suggestion .body { min-width: 0; flex: 1; }
  .suggestion .title { font-size: 0.85em; font-weight: 600; }
  .suggestion .from { font-size: 0.72em; color: var(--ink-muted); }
  .suggestion .actions { display: flex; gap: 5px; flex-shrink: 0; }
  .suggestion button {
    font: inherit;
    font-size: 0.75em;
    padding: 2px 8px;
    border: 1px solid var(--suggestion-border);
    border-radius: 5px;
    background: transparent;
    color: var(--ink-secondary);
    cursor: pointer;
  }
  .suggestion button.accept { background: var(--suggestion-border); color: #fff; }

  /* ---- shipped ---- */
  details.shipped { margin-top: 8px; }
  details.shipped summary {
    cursor: pointer;
    font-size: 0.76em;
    color: var(--ink-muted);
    user-select: none;
    padding: 2px 4px;
  }
  .shipped-list { margin: 4px 0 0 16px; display: flex; flex-direction: column; gap: 3px; }
  .shipped-item {
    font-size: 0.78em;
    color: var(--ink-secondary);
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .shipped-item .when { color: var(--ink-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---- add form ---- */
  .add-form {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 7px;
    padding: 7px 8px;
  }
  .add-form.open { display: flex; }
  .add-form input, .add-form textarea {
    font: inherit;
    font-size: 0.8em;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--page);
    color: var(--ink-primary);
    resize: vertical;
  }
  .add-form .buttons { display: flex; gap: 5px; justify-content: flex-end; }
  .add-form button {
    font: inherit;
    font-size: 0.78em;
    padding: 4px 9px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-secondary);
    cursor: pointer;
  }
  .add-form button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  /* Compact schedule chips on a card. `late` is the only one that shouts. */
  .chip.dates { color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
  .chip.late {
    padding: 0 5px;
    border-radius: 4px;
    color: var(--danger);
    background: var(--danger-bg);
    font-weight: 600;
  }
  .chip.late::after { content: none; }

  /* ---- the timeline subview ------------------------------------------------------
     One axis for the whole page, shared by every group, so two products' bars are
     directly comparable. Bars are positioned as percentages of that axis rather than
     laid out in a grid of cells, because a month is not a fixed width in time. */
  .gantt-scroll { overflow-x: auto; padding-bottom: 4px; }
  .gantt {
    --gutter: 290px;
    min-width: 900px;
  }
  /* The gutter halves on a narrow window, which leaves no room for a project row's
     meter - the "3/9" beside it says the same thing in a tenth of the width. */
  @media (max-width: 700px) {
    .gantt { --gutter: 160px; }
    .gantt-label .meter { display: none; }
  }
  /* NOT sticky, deliberately. `overflow-x: auto` on the wrapper makes it the nearest
     scrollport in BOTH axes, so a `position: sticky` axis here is measured against that
     box rather than the window - it renders `top` pixels down from the top of the
     timeline, on top of the first rows, and never sticks to anything. The today line
     runs the full height of the body instead, which is the orientation anchor that
     survives scrolling. */
  .gantt-head {
    display: grid;
    grid-template-columns: var(--gutter) 1fr;
    background: var(--page);
    border-bottom: 1px solid var(--border);
  }
  .gantt-legend {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
    font-size: 0.72em;
    color: var(--ink-muted);
    flex-wrap: wrap;
  }
  .gantt-legend .key { display: inline-flex; align-items: center; gap: 5px; }
  /* Real bars are absolutely positioned inside a track; the legend borrows their fill
     but has to put them back in flow. */
  .gantt-legend .swatch { position: static; width: 18px; height: 8px; border-radius: 2px; }
  .gantt-legend .swatch.gantt-age { height: 0; align-self: center; }
  .gantt-legend .swatch.gantt-target { width: 9px; height: 9px; margin: 0; }
  .gantt-scale { position: relative; height: 34px; }
  .gantt-quarter {
    position: absolute;
    top: 0;
    height: 16px;
    font-size: 0.7em;
    font-weight: 650;
    color: var(--ink-secondary);
    padding-left: 5px;
    border-left: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
  }
  .gantt-quarter.is-current { color: var(--accent); }
  .gantt-month {
    position: absolute;
    top: 17px;
    height: 15px;
    font-size: 0.64em;
    color: var(--ink-muted);
    padding-left: 4px;
    border-left: 1px solid var(--hairline);
    white-space: nowrap;
    overflow: hidden;
  }
  .gantt-body { position: relative; }
  /* One gridline layer behind every row, rather than a background per track. */
  .gantt-lines {
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--gutter);
    right: 0;
    pointer-events: none;
  }
  .gantt-lines .q { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); }
  .gantt-lines .m { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--hairline); }
  .gantt-today {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--today);
    opacity: 0.75;
  }
  /* In the scale it starts below the quarter label, so it cannot strike through one. */
  .gantt-today.head { top: 17px; }
  .gantt-legend .swatch.today {
    width: 2px;
    height: 12px;
    border-radius: 0;
    background: var(--today);
  }
  /* The heading and its counts both stay in the label gutter. Spilling the tally into
     the second column would print it across the time axis, where the gridlines run
     through the text and it reads as a bar that starts in April. */
  /* A button, not a div: the timeline's sections fold exactly like the lane view's, so
     "Collapse all" means the same thing whichever view you are in. */
  .gantt-group {
    display: block;
    width: var(--gutter);
    padding: 12px 10px 3px 0;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .gantt-group:hover { background: var(--hover); }
  .gantt-group .head-line { display: flex; align-items: center; gap: 7px; }
  .gantt-group .chevron {
    flex: 0 0 auto;
    color: var(--ink-muted);
    font-size: 0.7em;
    transition: transform 0.15s ease;
  }
  .gantt-group.collapsed .chevron { transform: rotate(-90deg); }
  /* A sub-product heading. Indented inside the gutter, where the parent heading it
     belongs to sits directly above it - the timeline draws one flat column of rows, so
     depth here is the indent and the rule, not a nested box. Less top padding than a
     top-level heading: it groups with the heading above rather than starting fresh. The
     indent itself scales with depth and is set inline by renderTimeline, since it has to
     come out of the shared gutter width. */
  .gantt-group.sub {
    padding-top: 8px;
    border-left: 2px solid var(--border);
    padding-left: 9px;
  }
  .gantt-group.sub h2 { font-weight: 600; color: var(--ink-secondary); }
  .gantt-group h2 {
    margin: 0;
    font-size: 0.85em;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gantt-group .tally {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 1px;
    font-size: 0.72em;
    color: var(--ink-muted);
  }
  .gantt-row {
    display: grid;
    grid-template-columns: var(--gutter) 1fr;
    align-items: center;
    min-height: 23px;
    position: relative;
  }
  .gantt-row:hover { background: var(--hover); }
  /* A folded project's change rows stay in the DOM and are only hidden, so opening one
     doesn't rebuild the timeline and throw away where you had scrolled to. The UA's own
     `[hidden]` rule loses to `display: grid` above, so it has to be restated. */
  .gantt-row[hidden] { display: none; }
  .gantt-label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px 0 12px;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    min-width: 0;
  }
  .gantt-label .name {
    font-size: 0.79em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Second to the title for space: a truncated change is unreadable, a truncated
     product name is still recognisable. */
  .gantt-label .sub {
    font-size: 0.68em;
    color: var(--ink-muted);
    white-space: nowrap;
    max-width: 12ch;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* The lane card nudges its dot down to sit on the first line of a wrapping title; a
     timeline row is one line, so it just centres. */
  .gantt-label .status-dot { align-self: center; transform: none; margin-top: 0; }
  /* The project row, and the change rows that fold out beneath it. The indent is the
     only thing saying "these belong to the row above", so it is worth more than the
     12px of label width it costs. */
  .gantt-row.is-project { min-height: 26px; }
  .gantt-row.is-project .gantt-label .name { font-weight: 650; }
  .gantt-label .twisty {
    flex: 0 0 auto;
    width: 13px;
    font-size: 0.85em;
    line-height: 1;
    text-align: center;
    color: var(--ink-secondary);
    transition: transform 0.15s ease;
  }
  .gantt-label .twisty.closed { transform: rotate(-90deg); }
  /* The timeline's gutter is a fixed width every row shares, so a glyph has to come out
     of the name's budget. Kept anyway - it is the same vocabulary the board uses, and a
     view you have to re-learn is worse than a name three characters shorter - but sized
     down and tucked against the name. */
  .gantt-label .kind { width: 12px; height: 12px; margin-right: -2px; }
  .gantt-group .head-line .kind { width: 13px; height: 13px; margin-right: -2px; }
  /* Indented to where the project's NAME starts, now that a glyph sits before it:
     12 label padding + 13 twisty + 6 gap + 12 glyph - 2 tuck + 6 gap. */
  .gantt-row.is-change .gantt-label { padding-left: 47px; }
  .gantt-row.is-change .gantt-detail { padding-left: 65px; }
  .gantt-label .meter { margin-left: auto; }
  .gantt-label .count {
    flex: 0 0 auto;
    font-size: 0.7em;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .gantt-track { position: relative; height: 23px; }
  /* A bar carries two independent facts, so it has two independent modifiers rather
     than one class per combination:
       COLOUR (--bar)  what state the change is in - pending / in progress / shipped,
                       or overdue, which overrides the others because a missed date is
                       the thing you need to see first.
       FILL            solid when the span comes from real dates the change carries;
                       hatched when it is derived from the Now / Next / Later horizon.
                       A hatch reads as "a band, not a date", which is exactly the
                       claim an undated change can make. */
  .gantt-bar {
    position: absolute;
    top: 6px;
    height: 11px;
    min-width: 4px;
    border-radius: 3px;
    background: var(--bar);
  }
  .gantt-bar.s-pending, .gantt-summary.s-pending, .gantt-reach.s-pending { --bar: var(--status-pending); }
  .gantt-bar.s-in_progress, .gantt-summary.s-in_progress, .gantt-reach.s-in_progress { --bar: var(--status-in-progress); }
  .gantt-bar.s-done, .gantt-summary.s-done, .gantt-reach.s-done { --bar: var(--status-done); }
  .gantt-bar.s-overdue, .gantt-summary.s-overdue, .gantt-reach.s-overdue { --bar: var(--danger); }
  .gantt-bar.derived {
    background: repeating-linear-gradient(135deg, var(--bar) 0 3px, transparent 3px 7px);
    border: 1px solid var(--bar);
    opacity: 0.8;
  }
  .gantt-bar.clip-start { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .gantt-bar.clip-end { border-top-right-radius: 0; border-bottom-right-radius: 0; }

  /* The project's own bar: the span its DATED changes actually cover, drawn with the
     downward end caps a summary row has carried since the first Gantt charts, so a
     rolled-up span can never be mistaken for one change's committed dates. Its colour
     is the worst state underneath it - one overdue change makes the whole project
     read overdue, which is the point of looking at this level. */
  .gantt-summary {
    position: absolute;
    top: 8px;
    height: 6px;
    min-width: 4px;
    border-radius: 2px;
    background: var(--bar);
  }
  .gantt-summary::before,
  .gantt-summary::after {
    content: "";
    position: absolute;
    top: 100%;
    width: 0;
    height: 0;
    border-top: 4px solid var(--bar);
  }
  .gantt-summary::before { left: 0; border-right: 4px solid transparent; }
  .gantt-summary::after { right: 0; border-left: 4px solid transparent; }
  /* How far the project REACHES once its undated changes are counted - drawn as a
     dashed rule rather than as more bar, because one un-dated "later" change would
     otherwise stretch a solid, committed-looking envelope two quarters past anything
     anyone has actually committed to. A project with no dates at all is this line and
     nothing else, which is the honest picture of it. */
  .gantt-reach {
    position: absolute;
    top: 10px;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--bar) 0 4px, transparent 4px 8px);
    opacity: 0.7;
  }
  /* Legend copies: no caps, and back in flow. */
  .gantt-legend .swatch.gantt-summary { height: 6px; }
  .gantt-legend .swatch.gantt-summary::before,
  .gantt-legend .swatch.gantt-summary::after { content: none; }
  .gantt-legend .swatch.gantt-reach { height: 2px; align-self: center; }
  /* The committed target date, marked on the bar rather than replacing it - on a
     shipped change the gap between the bar's end and this diamond IS the slip. */
  .gantt-target {
    position: absolute;
    top: 7px;
    width: 9px;
    height: 9px;
    margin-left: -5px;
    transform: rotate(45deg);
    background: var(--surface);
    border: 1.5px solid var(--mark, var(--ink-secondary));
  }
  .gantt-target.met { background: var(--mark, var(--ink-secondary)); }
  .gantt-target.missed { --mark: var(--danger); }
  /* How long it has been sitting on the board before its horizon opens. */
  .gantt-age {
    position: absolute;
    top: 11px;
    height: 1px;
    border-top: 1px dotted var(--ink-muted);
    opacity: 0.6;
  }
  .gantt-detail {
    grid-column: 1 / -1;
    padding: 2px 12px 8px 30px;
    background: var(--surface);
    border-top: 1px solid var(--hairline);
  }
  .gantt-detail .card-meta { padding: 4px 0 0; }
  .gantt-empty { grid-column: 1 / -1; font-size: 0.76em; color: var(--ink-muted); padding: 2px 12px 4px; }

  /* ---- shared bits ---- */
  .lens-empty { font-size: 0.85em; color: var(--ink-muted); padding: 20px 4px; }
  .lens-empty a { color: var(--accent); }

  /* ---- linked Jira / ADO ticket ----
     One palette for the canonical types trackers.py normalises onto (its CANONICAL_TYPES
     is the source of these slugs). Semantic rather than vendor-matched, because Jira and
     ADO colour the same rungs differently and a board showing both needs one consistent
     scale: epic/feature are the two "big" rungs, story/task the delivery rungs, bug is the
     only red, spike is research, subtask recedes.

     Colour is never the only signal - the badge always carries the tracker's own type name
     as text, so this reads correctly in greyscale and to a colour-blind viewer. The
     compact variant on a collapsed card drops the type WORD for space, so it also keeps
     the type in its tooltip and the full badge is one click away. */
  .ticket-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    max-width: 100%;
    padding: 0 6px;
    border: 1px solid var(--ticket-color, var(--border));
    border-left: 3px solid var(--ticket-color, var(--border));
    border-radius: 5px;
    background: var(--ticket-bg, transparent);
    color: var(--ticket-color, var(--ink-secondary));
    font-size: 0.7em;
    line-height: 1.7;
    font-weight: 600;
    text-decoration: none;
  }
  a.ticket-badge:hover { text-decoration: underline; }
  .ticket-badge .ticket-type {
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .ticket-badge.compact .ticket-type,
  .ticket-badge.compact .ticket-state { display: none; }
  .ticket-badge .ticket-key {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-weight: 500;
    opacity: 0.85;
    white-space: nowrap;
  }
  .ticket-badge .ticket-state {
    color: var(--ink-muted);
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* A link whose ticket wasn't in the last sync: shown, never hidden, and visibly
     different from a resolved one so "not synced yet" can't read as "type unknown". */
  .ticket-badge.unresolved {
    border-style: dashed;
    border-left-style: dashed;
    color: var(--ink-muted);
    --ticket-color: var(--ink-muted);
    --ticket-bg: transparent;
  }
  .ticket-badge[data-type="epic"]    { --ticket-color: #8b5cf6; --ticket-bg: rgba(139, 92, 246, 0.10); }
  .ticket-badge[data-type="feature"] { --ticket-color: #6366f1; --ticket-bg: rgba(99, 102, 241, 0.10); }
  .ticket-badge[data-type="story"]   { --ticket-color: #0f9d58; --ticket-bg: rgba(15, 157, 88, 0.10); }
  .ticket-badge[data-type="task"]    { --ticket-color: #2a78d6; --ticket-bg: rgba(42, 120, 214, 0.10); }
  .ticket-badge[data-type="bug"]     { --ticket-color: #d03b3b; --ticket-bg: rgba(208, 59, 59, 0.10); }
  .ticket-badge[data-type="spike"]   { --ticket-color: #b8860b; --ticket-bg: rgba(184, 134, 11, 0.12); }
  .ticket-badge[data-type="subtask"] { --ticket-color: #6b7280; --ticket-bg: rgba(107, 114, 128, 0.10); }
  .ticket-badge[data-type="other"]   { --ticket-color: #898781; --ticket-bg: rgba(137, 135, 129, 0.10); }
  @media (prefers-color-scheme: dark) {
    .ticket-badge[data-type="epic"]    { --ticket-color: #a78bfa; --ticket-bg: rgba(167, 139, 250, 0.16); }
    .ticket-badge[data-type="feature"] { --ticket-color: #818cf8; --ticket-bg: rgba(129, 140, 248, 0.16); }
    .ticket-badge[data-type="story"]   { --ticket-color: #34d399; --ticket-bg: rgba(52, 211, 153, 0.15); }
    .ticket-badge[data-type="task"]    { --ticket-color: #3987e5; --ticket-bg: rgba(57, 135, 229, 0.18); }
    .ticket-badge[data-type="bug"]     { --ticket-color: #e66767; --ticket-bg: rgba(230, 103, 103, 0.16); }
    .ticket-badge[data-type="spike"]   { --ticket-color: #d4a72c; --ticket-bg: rgba(212, 167, 44, 0.16); }
    .ticket-badge[data-type="subtask"] { --ticket-color: #9ca3af; --ticket-bg: rgba(156, 163, 175, 0.14); }
    .ticket-badge[data-type="other"]   { --ticket-color: #a8a6a0; --ticket-bg: rgba(168, 166, 160, 0.14); }
  }

  /* Sync status strip. One line above the board, only on a deployment that configured
     [[trackers]]; otherwise the page has no strip at all. */
  #tracker-bar {
    display: none;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--hairline);
    font-size: 0.75em;
    color: var(--ink-muted);
  }
  #tracker-bar.visible { display: flex; }
  /* Same bar geometry as the tracker strip above, in the warning colour: this one is
     work still to do, not a status line. */
  #unattributed-bar {
    display: none;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--suggestion-bg);
    color: var(--suggestion-border);
    font-size: 0.75em;
  }
  #unattributed-bar.visible { display: flex; }
  #unattributed-bar a { color: inherit; font-weight: 600; }
  #tracker-bar button {
    font: inherit;
    padding: 2px 9px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    color: var(--ink-secondary);
    cursor: pointer;
  }
  #tracker-bar button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #tracker-bar button:disabled { opacity: 0.6; cursor: default; }
  .tracker-chip { display: inline-flex; align-items: center; gap: 5px; }
  .tracker-chip .dot { font-size: 0.9em; line-height: 1; }
  .tracker-chip.ok .dot { color: var(--status-done); }
  .tracker-chip.failed { color: var(--danger); }
  .tracker-chip.failed .dot { color: var(--danger); }
  .tracker-chip.never .dot { color: var(--ink-muted); }

  /* Link picker: a plain modal, consistent with the board's prompt-driven controls. */
  #ticket-picker {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.45);
    align-items: flex-start;
    justify-content: center;
    padding: 8vh 16px 16px;
  }
  #ticket-picker.open { display: flex; }
  #ticket-picker .sheet {
    width: min(620px, 100%);
    max-height: 74vh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  #ticket-picker h2 { margin: 0 0 4px; font-size: 1em; }
  #ticket-picker .sub { margin: 0 0 12px; font-size: 0.82em; color: var(--ink-muted); }
  #ticket-picker input[type="text"] {
    width: 100%;
    padding: 9px 11px;
    font: inherit;
    font-size: 0.9em;
    color: var(--ink-primary);
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 7px;
  }
  #picker-results {
    flex: 1;
    overflow-y: auto;
    margin: 12px -4px 0;
    padding: 0 4px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .picker-row {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--page);
    font: inherit;
    font-size: 0.85em;
    color: var(--ink-primary);
    text-align: left;
    cursor: pointer;
  }
  .picker-row:hover:not(:disabled) { border-color: var(--accent); }
  .picker-row:disabled { opacity: 0.5; cursor: not-allowed; }
  .picker-row .row-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker-row .row-taken { font-size: 0.85em; color: var(--ink-muted); white-space: nowrap; }
  #picker-note { margin-top: 10px; font-size: 0.8em; color: var(--ink-muted); }
  #picker-note.error { color: var(--danger); }
  #ticket-picker .sheet-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #ticket-picker .sheet-actions button {
    font: inherit;
    font-size: 0.85em;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-secondary);
    cursor: pointer;
  }
  #ticket-picker .sheet-actions button.primary {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
  }
  #ticket-picker .sheet-actions button:disabled { opacity: 0.55; cursor: default; }
  #picker-unlink { margin-right: auto; }
  #picker-unlink.hidden { display: none; }
</style>
</head>
<body>
<div id="pm-nav" data-page="roadmap"></div>
<main>
  <!-- Shown only when the deployment configured [[trackers]]. -->
  <div id="tracker-bar"></div>
  <!-- Shown only while changes predating the system layer are still unattributed. -->
  <div id="unattributed-bar"></div>
  <div id="board"></div>
</main>
<div id="ticket-picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
  <div class="sheet">
    <h2 id="picker-title">Link a ticket</h2>
    <p class="sub" id="picker-sub"></p>
    <input id="picker-input" type="text" autocomplete="off"
           placeholder="Search synced tickets, or paste a ticket URL / key" />
    <div id="picker-results"></div>
    <div id="picker-note"></div>
    <div class="sheet-actions">
      <button type="button" class="ghost" id="picker-unlink">Unlink</button>
      <button type="button" class="ghost" id="picker-cancel">Cancel</button>
      <button type="button" class="primary" id="picker-link">Link</button>
    </div>
  </div>
</div>
<script>
  const board = document.getElementById("board");

  const BUCKETS = [["now", "Now"], ["next", "Next"], ["later", "Later"]];
  const BUCKET_RANK = { now: 0, next: 1, later: 2 };
  const STATUS_LABEL = { pending: "Pending", in_progress: "In progress", done: "Done" };

  let PRODUCTS = {};
  // The taxonomy's hierarchy: child product id -> parent id, for children only (see
  // config._parse_products). Empty on a flat deployment, and every helper below then
  // answers what it answered before hierarchy existed - one section per product, no
  // nesting - so a flat board is not a special case anywhere in this file.
  let PRODUCT_PARENTS = {};
  // The system taxonomy: system id -> label, and product id -> the systems it touches.
  // Both empty on a deployment that declares no [systems], which is what keeps every
  // system-shaped thing on this board invisible there rather than empty.
  let SYSTEMS = {};
  let PRODUCT_SYSTEMS = {};
  let UNATTRIBUTED = { changes: [], count: 0, not_yet_in_scope: 0, products_missing_systems: [] };
  // Operator-declared facts per product (owner/team/stage/description), only for
  // products that declared any. Context on the section heading, never layout.
  let PRODUCT_META = {};
  const systemsDeclared = () => Object.keys(SYSTEMS).length > 0;
  /* Attribution is scoped PER PRODUCT: a board is in scope once its product declares what
     it touches, and untouched until then. Mirrors roadmap.requires_system exactly - the
     board must not ask for something the server would not require, nor flag its absence. */
  const requiresSystem = (product) =>
    systemsDeclared() && (PRODUCT_SYSTEMS[product] || []).length > 0;
  let itemsByProduct = {}; // product -> [item] (that product's OWN changes only)

  function parentOf(product) {
    return PRODUCT_PARENTS[product] ?? null;
  }
  // PRODUCTS arrives ordered (parent, then its children), so these preserve display order.
  function childrenOf(product) {
    return Object.keys(PRODUCTS).filter((p) => parentOf(p) === product);
  }
  function topLevelProducts() {
    return Object.keys(PRODUCTS).filter((p) => !parentOf(p));
  }
  /* A product then its descendants at every depth, in display order - the mirror of
     roadmap.subtree_products, including its cycle guard: the server refuses a cyclic
     taxonomy at config load, and an unguarded walk here would hang the render rather
     than draw a slightly wrong board. */
  function subtreeProducts(product, seen = new Set()) {
    if (seen.has(product)) return [];
    seen.add(product);
    return [product, ...childrenOf(product).flatMap((c) => subtreeProducts(c, seen))];
  }
  function productLabel(product) {
    return PRODUCTS[product] ?? product;
  }
  /* Everything above a product, nearest parent first; [] for a top-level one. The `seen`
     guard mirrors roadmap.ancestors_of: the server refuses a cyclic taxonomy at config
     load, and a hang in a render loop is a worse way to find that out than a wrong label. */
  function ancestorsOf(product) {
    const chain = [];
    const seen = new Set([product]);
    let cursor = parentOf(product);
    while (cursor && !seen.has(cursor)) {
      chain.push(cursor);
      seen.add(cursor);
      cursor = parentOf(cursor);
    }
    return chain;
  }
  function depthOf(product) {
    return ancestorsOf(product).length;
  }
  /* The full path down to a product - "Web App / Auth / SSO" - or the plain label for a
     top-level one. Used where a product is named with no section around it to say where it
     sits: a card's chip in the initiative lens, a "suggested by" line, the move picker. */
  function productPathLabel(product) {
    const ancestors = ancestorsOf(product);
    if (!ancestors.length) return productLabel(product);
    return [...ancestors.reverse(), product].map(productLabel).join(" / ");
  }
  // The work model, used only by the initiative grouping. Empty on a deployment that
  // doesn't use /portfolio, in which case everything lands in one "Unaligned" group.
  let PORTFOLIO = { initiatives: [], projects: [], catch_all_project_id: null };
  // External trackers (see trackers.py). `configured: false` on a deployment with no
  // [[trackers]] block, which hides every ticket control on this page.
  let TRACKERS = { configured: false, syncing: false, trackers: [], last_sync_at: null };

  /* Two independent axes, not one four-way switch:
       groupBy - what the sections are (product | initiative)
       view    - how the changes inside a section are drawn (board | timeline)
     Every combination is valid and both are persisted, so the board comes back the way
     you left it. */
  let groupBy = localStorage.getItem("roadmapGroupBy") === "initiative" ? "initiative" : "product";
  let view = localStorage.getItem("roadmapView") === "timeline" ? "timeline" : "board";

  /* Which sections are folded, which projects are opened out, and which cards are open.
     All three live outside the DOM because renderAll() rebuilds everything from scratch
     on every websocket event - without this, a fold would reset the instant anyone else
     touched the board.

     The two structural levels persist; an open card is a transient reading state and
     deliberately does not. A project starts CLOSED and there is no stored default that
     can change that, which is what makes the section read as a plan rather than as a
     backlog the first time you land on it. */
  const collapsed = new Set(JSON.parse(localStorage.getItem("roadmapCollapsedGroups") || "[]"));
  const openProjects = new Set(JSON.parse(localStorage.getItem("roadmapOpenProjects") || "[]"));
  const openCards = new Set();

  function persistCollapsed() {
    localStorage.setItem("roadmapCollapsedGroups", JSON.stringify([...collapsed]));
  }

  function persistOpenProjects() {
    localStorage.setItem("roadmapOpenProjects", JSON.stringify([...openProjects]));
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function relativeTime(seconds) {
    if (!seconds) return "";
    const diff = Date.now() / 1000 - seconds;
    if (diff < 60) return "just now";
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    if (diff < 86400 * 30) return `${Math.floor(diff / 86400)}d ago`;
    return new Date(seconds * 1000).toLocaleDateString();
  }

  function shortDate(ms) {
    return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  /* Schedule dates are "YYYY-MM-DD" calendar dates (see roadmap.py), so they are read
     with the LOCAL Date constructor, never Date.parse / new Date("2026-09-30") - that
     spelling is parsed as UTC midnight and lands on the 29th for anyone west of it,
     which is the exact bug the string storage exists to avoid. */
  function dateMs(iso) {
    if (!iso) return null;
    const [y, m, d] = iso.split("-").map(Number);
    return +new Date(y, m - 1, d);
  }
  // The exclusive end of a target day: a change due on the 30th owns the whole 30th.
  function endOfDayMs(iso) {
    const start = dateMs(iso);
    return start == null ? null : start + 86400000;
  }
  function todayMs() {
    const now = new Date();
    return +new Date(now.getFullYear(), now.getMonth(), now.getDate());
  }
  function daysBetween(aMs, bMs) {
    return Math.round((bMs - aMs) / 86400000);
  }
  // "Sep 30" for a date this year, "Sep 30 2027" when the year is not the obvious one.
  function dateLabelMs(ms) {
    if (ms == null) return "";
    const opts = { month: "short", day: "numeric" };
    if (new Date(ms).getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
    return new Date(ms).toLocaleDateString(undefined, opts);
  }
  function dateLabel(iso) {
    return dateLabelMs(dateMs(iso));
  }

  // ---- the view switches, mounted into the shared nav's controls slot ----

  function segmented(label, options, current, onPick) {
    const wrap = el("div", "pmnav-seg");
    wrap.setAttribute("role", "group");
    wrap.setAttribute("aria-label", label);
    for (const [value, text, hint] of options) {
      const button = el("button", null, text);
      button.type = "button";
      button.setAttribute("aria-pressed", String(value === current));
      if (hint) button.title = hint;
      button.addEventListener("click", () => onPick(value));
      wrap.appendChild(button);
    }
    return wrap;
  }

  /* One button rather than two, because "collapse all" and "expand all" are never both
     useful at once: whichever the board is not already in is the one worth offering.
     It acts on the sections you can currently see - the keys come from currentGroups(),
     so switching the grouping switches what "all" means, and a fold stored against the
     other grouping is left alone rather than silently dropped. */
  function collapseAllButton() {
    // Nested sections included: a sub-product section is one of the things "all" means,
    // and leaving them out would make "expand all" open a parent onto folded children.
    const keys = groupKeys(currentGroups());
    const allCollapsed = keys.length > 0 && keys.every((k) => collapsed.has(k));
    const button = el("button", "pmnav-action", allCollapsed ? "Expand all" : "Collapse all");
    button.type = "button";
    button.title = allCollapsed
      ? `Open all ${keys.length} ${groupBy === "initiative" ? "initiatives" : "products"}`
      : `Fold all ${keys.length} ${groupBy === "initiative" ? "initiatives" : "products"} down to their headings`;
    button.disabled = !keys.length;
    button.addEventListener("click", () => {
      const hadFocus = document.activeElement === button;
      for (const key of keys) {
        if (allCollapsed) collapsed.delete(key); else collapsed.add(key);
      }
      persistCollapsed();
      renderAll();
      // renderAll() rebuilds the slot, so the button that was just clicked no longer
      // exists - without this, a keyboard user is dropped back to the top of the page
      // between "collapse all" and the "expand all" that undoes it.
      if (hadFocus) {
        const next = document.querySelector("#pm-nav-slot .pmnav-action");
        if (next) next.focus();
      }
    });
    return button;
  }

  function mountControls(slot) {
    slot.textContent = "";
    slot.appendChild(collapseAllButton());
    slot.appendChild(el("span", "pmnav-seg-label", "Group by"));
    slot.appendChild(segmented("Group changes by", [
      ["product", "Product", "One section per product board"],
      ["initiative", "Initiative", "One section per initiative — an initiative can span products"],
    ], groupBy, (value) => {
      groupBy = value;
      localStorage.setItem("roadmapGroupBy", value);
      renderAll();
    }));
    slot.appendChild(el("span", "pmnav-seg-label", "View"));
    slot.appendChild(segmented("View changes as", [
      ["board", "Now / Next / Later", "Three horizon lanes per section"],
      ["timeline", "Timeline", "Every change on one shared time axis"],
    ], view, (value) => {
      view = value;
      localStorage.setItem("roadmapView", value);
      renderAll();
    }));
  }

  /* Guarded, because this runs BEFORE loadBoard() at the bottom of the script and an
     uncaught throw here would take the whole board with it - a blank page under a
     working nav bar, which is a genuinely baffling thing to debug. `PMNav.ready` is
     newer than `PMNav` itself, so a browser holding a cached older nav.js has the
     object without the promise. The server now sends `Cache-Control: no-cache` on the
     shared chrome so that pairing should not arise; this is the belt to that's braces,
     and the rule generalises - the board must never depend on the nav to render. */
  if (window.PMNav && PMNav.ready && typeof PMNav.ready.then === "function") {
    PMNav.ready.then(mountControls);
  } else {
    console.warn("PM Studio: nav controls slot unavailable — reload to pick up /static/nav.js.");
  }

  // ---- linked tickets (Jira / Azure DevOps) ----

  function ticketBadge(ticket, compact) {
    // An <a> when we know the URL, a <span> when we don't - a badge that looks clickable
    // and goes nowhere is worse than one that plainly isn't a link yet.
    const node = document.createElement(ticket.url ? "a" : "span");
    node.className = "ticket-badge" + (compact ? " compact" : "") + (ticket.unresolved ? " unresolved" : "");
    node.dataset.type = ticket.type || "other";
    if (ticket.url) {
      node.href = ticket.url;
      node.target = "_blank";
      node.rel = "noopener noreferrer";
    }

    // The tracker's OWN name for the type, not our normalised slug: a team that renamed
    // "Story" to "Deliverable" should see "Deliverable". The slug only picks the colour.
    const typeName = ticket.unresolved ? "Not synced" : (ticket.raw_type || "Ticket");
    node.appendChild(el("span", "ticket-type", typeName));
    node.appendChild(el("span", "ticket-key", ticket.key));
    if (ticket.state) node.appendChild(el("span", "ticket-state", ticket.state));

    node.title = ticket.unresolved
      ? `${ticket.key} is linked in ${ticket.tracker_label || ticket.tracker_id} but was not in the last sync. ` +
        `It may be new, outside the configured projects, or the tracker may be unreachable.`
      : `${typeName} ${ticket.key} — ${ticket.title || "(no title)"}\n` +
        `${ticket.tracker_label || ticket.tracker_id}${ticket.state ? " · " + ticket.state : ""}`;
    return node;
  }

  // ---- the change, in its two shapes ----

  function chip(text, className) {
    const node = el("span", "chip" + (className ? " " + className : ""), text);
    node.title = text;
    return node;
  }

  /* The glyph that says what kind of row this is - see the .kind rules. Drawn inline
     rather than pulled from an icon font or a sprite so it inherits the row's own
     colour and needs no second request; the paths are constants, never user text. */
  const KIND_SHAPES = {
    // A box: a product is the container everything else sits in.
    product: '<path d="M8 1.9 14 5.1v5.8L8 14.1 2 10.9V5.1z"/><path d="M2 5.1 8 8.3l6-3.2M8 8.3v5.8"/>',
    // A flag: an initiative is a bet planted somewhere, spanning whatever it spans.
    initiative: '<path d="M4 14.2V2.2"/><path d="M4 2.9h8L10.2 5.8 12 8.7H4z"/>',
    // A folder: a project holds changes.
    project: '<path d="M1.9 12.3V4.3a.5.5 0 0 1 .5-.5h3.3l1.5 1.8h6.4a.5.5 0 0 1 .5.5v6.2a.5.5 0 0 1-.5.5H2.4a.5.5 0 0 1-.5-.5z"/>',
  };
  const KIND_LABELS = {
    product: "Product",
    subproduct: "Sub-product",
    initiative: "Initiative",
    project: "Project",
    loose: "Changes with no project",
  };
  function kindIcon(kind) {
    // A sub-product is a product and the "No project" bucket is a project-shaped slot,
    // so they reuse those shapes rather than inventing a fifth thing to learn.
    const shape = kind === "subproduct" ? "product" : kind === "loose" ? "project" : kind;
    const node = el("span", `kind kind-${kind}`);
    node.title = KIND_LABELS[kind] || kind;
    node.innerHTML =
      '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor"'
      + ' stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"'
      // Dashed: nothing declared this row, it is where the leftovers went.
      + (kind === "loose" ? ' stroke-dasharray="2.4 2"' : "")
      + `>${KIND_SHAPES[shape]}</svg>`;
    return node;
  }

  /* An initiative section is an initiative at any depth (they don't nest); a product
     section drawn inside another one is a sub-product, which is a fact about where it
     is rather than about the product itself - so it is read off the depth, not the
     group. */
  function groupKind(group, depth) {
    if (group.kind === "initiative") return "initiative";
    return depth ? "subproduct" : "product";
  }

  // Rebuilt whenever the work model changes, rather than per card - a full board render
  // asks for a change's project once per chip, and there is one chip per card.
  let PROJECTS_BY_ID = {};
  function indexProjects() {
    PROJECTS_BY_ID = Object.fromEntries(PORTFOLIO.projects.map((p) => [p.id, p]));
  }

  /* The metadata a change carries, minus whatever the surrounding section already says.
     `omit` is how one function serves both groupings: a product section doesn't repeat
     the product on every card, an initiative section doesn't repeat the initiative. */
  function metaChips(item, omit = {}) {
    const chips = [];
    // The full path, because this chip only appears where the section does NOT name the
    // product (the initiative lens) - and there, "Billing" alone doesn't say whose.
    if (!omit.product) chips.push(chip(productPathLabel(item.product)));
    // The system a change is contained within - shown in both lenses, because unlike the
    // product and the initiative it is never what a section is grouped by. Named whenever
    // there is one; its absence is flagged only where the product is in scope, so a board
    // whose edge is still undeclared reads exactly as it did before the layer existed
    // rather than turning every card amber over missing config.
    if (item.system) chips.push(chip(SYSTEMS[item.system] || item.system));
    else if (requiresSystem(item.product)) chips.push(chip("no system", "warn"));
    const project = PROJECTS_BY_ID[item.project_id];
    // Inside a project row the project is the row's own heading, so repeating it on
    // every card would print the same word a dozen times down one column.
    if (!omit.project) {
      if (project) chips.push(chip(project.title));
      // Alignment is a practice the board surfaces, never a validation that blocks work -
      // so an unaligned change is flagged on its card and still shown everywhere else.
      else chips.push(chip("unaligned", "warn"));
    }
    if (item.owner) chips.push(chip(`External — ${item.owner}`, "owner"));
    // The schedule, in whatever shape it has. `is_overdue` is computed server-side
    // (roadmap.py) so the board and the PM's context block never disagree about what
    // "late" means on a machine whose clock or timezone differs.
    if (item.is_overdue) {
      chips.push(chip(`Overdue — ${dateLabel(item.target_at)}`, "late"));
    } else if (item.start_at && item.target_at) {
      chips.push(chip(`${dateLabel(item.start_at)} → ${dateLabel(item.target_at)}`, "dates"));
    } else if (item.target_at) {
      chips.push(chip(`Target ${dateLabel(item.target_at)}`, "dates"));
    } else if (item.start_at) {
      chips.push(chip(`Started ${dateLabel(item.start_at)}`, "dates"));
    }
    return chips;
  }

  /* Every write the board can make to one change, in one place, used by the card in the
     lane view and by the detail panel in the timeline view. */
  function itemControls(item) {
    const row = el("div", "controls");

    const statusSelect = el("select", "mini");
    statusSelect.title = "Status";
    for (const [value, label] of Object.entries(STATUS_LABEL)) {
      const opt = el("option", null, label);
      opt.value = value;
      opt.selected = value === item.status;
      statusSelect.appendChild(opt);
    }
    statusSelect.addEventListener("change", () => patchItem(item, { status: statusSelect.value }));
    row.appendChild(statusSelect);

    const bucketSelect = el("select", "mini");
    bucketSelect.title = "Horizon";
    for (const [value, label] of BUCKETS) {
      const opt = el("option", null, label);
      opt.value = value;
      opt.selected = value === item.bucket;
      bucketSelect.appendChild(opt);
    }
    bucketSelect.addEventListener("change", () => patchItem(item, { bucket: bucketSelect.value }));
    row.appendChild(bucketSelect);

    /* Re-attribution, in the same row as status and horizon. There is no blank option for
       an already-attributed change: a system is not something a change can go back to not
       having (see roadmap.validate_system). One appears only while it IS unattributed, as
       the prompt to fix it - and it is not selectable once anything else is chosen. */
    if (requiresSystem(item.product)) {
      const systemSelect = el("select", "mini");
      systemSelect.title = "The system this change is contained within";
      if (!item.system) {
        const prompt = el("option", null, "No system — pick one");
        prompt.value = "";
        systemSelect.appendChild(prompt);
      }
      for (const id of allowedSystems(item.product)) {
        const opt = el("option", null, SYSTEMS[id] || id);
        opt.value = id;
        opt.selected = id === item.system;
        systemSelect.appendChild(opt);
      }
      systemSelect.addEventListener("change", () => {
        if (!systemSelect.value) return;
        patchItem(item, { system: systemSelect.value });
      });
      row.appendChild(systemSelect);
    }

    const moveSelect = el("select", "mini");
    moveSelect.title = "Move to another product";
    const placeholder = el("option", null, "Move to…");
    placeholder.value = "";
    moveSelect.appendChild(placeholder);
    /* Grouped by family, one optgroup per top-level product holding its whole subtree in
       display order, indented one step per level: a flat list of every board stops being
       readable at the point a deployment has a dozen sub-products, which is exactly when
       moving things between them starts to matter. A top-level product with nothing below
       it is a plain option, not a group of one. */
    for (const top of topLevelProducts()) {
      const family = subtreeProducts(top).filter((id) => id !== item.product);
      if (!family.length) continue;
      const option = (id) => {
        const indent = depthOf(id) - depthOf(top);
        const opt = el("option", null,
          indent ? `${" ".repeat(indent * 2)}↳ ${productLabel(id)}` : productLabel(id));
        opt.value = id;
        // The closed select shows only the chosen option, so it carries the whole path.
        opt.title = productPathLabel(id);
        return opt;
      };
      if (subtreeProducts(top).length === 1) {
        moveSelect.appendChild(option(top));
        continue;
      }
      const optgroup = document.createElement("optgroup");
      optgroup.label = productLabel(top);
      for (const id of family) optgroup.appendChild(option(id));
      moveSelect.appendChild(optgroup);
    }
    moveSelect.addEventListener("change", () => {
      const target = moveSelect.value;
      if (!target) return;
      if (!confirm(`Move "${item.title}" to ${productPathLabel(target)}? It keeps its history and lands accepted on their board.`)) {
        moveSelect.value = "";
        return;
      }
      // A stakeholder acting on the board picked the destination directly, so it
      // lands already triaged - no extra accept step. A PM's own curl-based move
      // (see agent.py) omits this and lands untriaged for the destination to review.
      patchItem(item, { move_to_product: target, triaged: true });
    });
    row.appendChild(moveSelect);

    // The schedule. Two native date pickers rather than a prompt(), because a date is
    // the one field on this card where free text would mean parsing failures for a
    // stakeholder typing "end of Sept". Either can be cleared on its own; the server
    // refuses a start after its target and says so.
    for (const [field, label] of [["start_at", "Start"], ["target_at", "Target"]]) {
      const wrap = el("label", "date-field");
      wrap.appendChild(el("span", null, label));
      const input = el("input", "mini");
      input.type = "date";
      input.value = item[field] || "";
      input.title = `${label} date — clear the field to remove it`;
      input.addEventListener("change", () => patchItem(item, { [field]: input.value }));
      wrap.appendChild(input);
      row.appendChild(wrap);
    }

    const ownerBtn = el("button", null, "Owner…");
    ownerBtn.type = "button";
    ownerBtn.title = "Track work done by another person or team";
    ownerBtn.addEventListener("click", () => {
      const owner = prompt(
        "Who is doing this work outside PM Studio (person or team)?\nLeave blank to mark it as built here.",
        item.owner || ""
      );
      if (owner === null) return;
      patchItem(item, { owner: owner.trim() });
    });
    row.appendChild(ownerBtn);

    if (TRACKERS.configured) {
      const ticketBtn = el("button", null, item.ticket ? "Ticket…" : "Link ticket…");
      ticketBtn.type = "button";
      ticketBtn.title = item.ticket
        ? `Change or remove the ${item.ticket.key} link`
        : "Link this change to one Jira or Azure DevOps ticket";
      ticketBtn.addEventListener("click", () => openTicketPicker(item));
      row.appendChild(ticketBtn);
    }

    const del = el("button", "del", "Delete");
    del.type = "button";
    del.addEventListener("click", () => {
      if (!confirm(`Delete "${item.title}"?`)) return;
      fetch(`/roadmap/${item.product}/items/${item.id}`, { method: "DELETE" }).catch(() => {});
    });
    row.appendChild(del);

    return row;
  }

  function itemCard(item, omit) {
    const card = el("article", "card" + (openCards.has(item.id) ? " open" : ""));

    const main = el("button", "card-main");
    main.type = "button";
    main.setAttribute("aria-expanded", String(openCards.has(item.id)));
    const dot = el("span", `status-dot ${item.status}`);
    dot.title = STATUS_LABEL[item.status] || item.status;
    main.appendChild(dot);
    main.appendChild(el("span", "card-title", item.title));
    main.addEventListener("click", () => {
      const nowOpen = !openCards.has(item.id);
      if (nowOpen) openCards.add(item.id); else openCards.delete(item.id);
      card.classList.toggle("open", nowOpen);
      main.setAttribute("aria-expanded", String(nowOpen));
    });
    card.appendChild(main);

    // The ticket badge is a real link, so it sits outside the toggle button rather than
    // nested inside one - a link inside a button is neither reliably clickable nor valid.
    const meta = el("div", "card-meta");
    for (const node of metaChips(item, omit)) meta.appendChild(node);
    if (item.ticket) meta.appendChild(ticketBadge(item.ticket, true));
    card.appendChild(meta);

    const body = el("div", "card-body");
    if (item.description) body.appendChild(el("div", "desc", item.description));
    if (item.ticket) body.appendChild(ticketBadge(item.ticket, false));
    body.appendChild(itemControls(item));
    card.appendChild(body);

    return card;
  }

  function suggestionCard(item) {
    const card = el("div", "suggestion");
    const body = el("div", "body");
    body.appendChild(el("div", "title", item.title));
    body.appendChild(el("div", "from",
      `Suggested by ${productPathLabel(item.origin_product)}`
      + (item.description ? ` — ${item.description}` : "")));
    card.appendChild(body);

    const actions = el("div", "actions");
    const accept = el("button", "accept", "Accept");
    accept.type = "button";
    accept.addEventListener("click", () => patchItem(item, { triaged: true }));
    const dismiss = el("button", null, "Dismiss");
    dismiss.type = "button";
    dismiss.addEventListener("click", () => {
      fetch(`/roadmap/${item.product}/items/${item.id}`, { method: "DELETE" }).catch(() => {});
    });
    actions.appendChild(accept);
    actions.appendChild(dismiss);
    card.appendChild(actions);
    return card;
  }

  /* A PATCH can now be refused on its CONTENT, not just on permissions - a malformed
     date, or a start after its target, is a 400 naming the reason. Silently swallowing
     that would leave the control showing a value the server never stored, so the reason
     is shown and the board is refetched to put the control back to the truth. */
  function patchItem(item, fields) {
    return fetch(`/roadmap/${item.product}/items/${item.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    })
      .then((r) => {
        if (r.ok) return;
        return r.json().catch(() => ({})).then((body) => {
          alert(body.detail || "That change could not be saved.");
          loadBoard();
        });
      })
      .catch(() => {});
  }

  /* The systems a change on this product may be attributed to. Only ever called for a
     product in scope, so this is exactly what it declares - the server accepts any
     declared system on an out-of-scope board, but offering that here would invite the
     wrong attribution instead of leaving it for the config to say. */
  function allowedSystems(product) {
    return PRODUCT_SYSTEMS[product] || [];
  }

  function systemOptions(product, selected) {
    return allowedSystems(product)
      .map((id) => {
        const label = SYSTEMS[id] || id;
        return `<option value="${id}"${id === selected ? " selected" : ""}>${label}</option>`;
      })
      .join("");
  }

  function addForm(product, bucket, projectId) {
    const form = el("form", "add-form");
    // Required, not optional: a change is contained within exactly one system, so the
    // picker has no blank option and the server refuses a create without one. Absent
    // entirely on a board that is not in scope, where the server requires nothing.
    const systemField = requiresSystem(product)
      ? `<label class="date-field"><span>System</span>
           <select class="mini system" required>${systemOptions(product)}</select>
         </label>`
      : "";
    form.innerHTML = `
      <input type="text" placeholder="Title" class="title" required />
      <textarea placeholder="Description (optional)" class="desc" rows="2"></textarea>
      <input type="text" placeholder="External owner (optional)" class="owner" />
      ${systemField}
      <label class="date-field"><span>Target</span><input type="date" class="mini target" /></label>
      <div class="buttons">
        <button type="button" class="cancel">Cancel</button>
        <button type="submit" class="primary">Add</button>
      </div>
    `;
    form.querySelector(".cancel").addEventListener("click", () => form.classList.remove("open"));
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = form.querySelector(".title").value.trim();
      if (!title) return;
      const payload = {
        title,
        description: form.querySelector(".desc").value.trim(),
        owner: form.querySelector(".owner").value.trim(),
        // Only the target is offered here: a date you commit to at the moment you raise
        // the change. A start date is something you set when work actually begins, so
        // it lives on the card rather than in the create form.
        target_at: form.querySelector(".target").value,
        bucket,
        status: "pending",
      };
      const systemField = form.querySelector(".system");
      if (systemField) payload.system = systemField.value;
      // Adding from inside an initiative section means the change belongs to that
      // initiative's work - so it lands on its project rather than unaligned.
      if (projectId) payload.project_id = projectId;
      fetch(`/roadmap/${product}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then((r) => {
        // Kept open with the typed values intact when the server refuses it - clearing
        // the form on a rejected date would throw away what the user just wrote.
        if (!r.ok) {
          return r.json().catch(() => ({})).then((body) => {
            alert(body.detail || "That change could not be created.");
          });
        }
        form.reset();
        form.classList.remove("open");
      }).catch(() => {});
    });
    return form;
  }

  // ---- grouping: the sections, whichever view draws them ----

  function allChanges() {
    return Object.values(itemsByProduct).flat();
  }

  /* A group is { key, title, flags, changes, omit, product, projectIds, subgroups }.

     `product` is the one product board this section is about, or null when it spans
     several - it is what lets a project row inside the section know where a new change
     would go. `projectIds` is an explicit, ordered list of the projects the section
     should show as rows even when they hold no changes yet (an initiative's own
     projects are part of its plan whether or not anything has been raised against them
     yet), or null to mean "just whatever the changes turn out to belong to".

     `subgroups` are sections nested INSIDE this one - a parent product's child products.
     Empty for every other kind of section. The invariant that makes the counting below
     safe: `changes` is always a section's OWN changes only, never its descendants', so
     every change belongs to exactly one section however deep the taxonomy goes. What a
     parent shows about its children it takes from the subgroups. */
  function groupsByProduct() {
    // `seen` is the same cycle guard subtreeProducts carries - this recursion is what
    // builds the whole board, so an unguarded one would hang the page.
    const productGroup = (product, seen = new Set()) => {
      seen.add(product);
      const meta = PRODUCT_META[product];
      return {
        key: `product:${product}`,
        kind: "product",
        title: productLabel(product),
        // The stage badge only when it says something: discovery/development/sunset are
        // the states worth a glance, steady-state ga is not. Owner and team ride the
        // heading's tooltip (see the head renderers) rather than being chrome.
        flags: meta && meta.stage !== "ga" ? [[meta.stage, false]] : [],
        changes: itemsByProduct[product] ?? [],
        omit: { product: true },
        product,
        // A product board doesn't own projects, so an empty project has no business
        // appearing under it - the rows are derived from the changes actually here.
        projectIds: null,
        subgroups: childrenOf(product)
          .filter((c) => !seen.has(c))
          .map((c) => productGroup(c, seen)),
      };
    };
    return topLevelProducts().map((p) => productGroup(p));
  }

  /* Every change a section holds, its sub-products included - what a parent's heading
     counts, since folded shut it stands for the whole family. */
  function groupChanges(group) {
    return [...group.changes, ...(group.subgroups || []).flatMap(groupChanges)];
  }

  function groupKeys(groups) {
    return groups.flatMap((g) => [g.key, ...groupKeys(g.subgroups || [])]);
  }

  /* Every section nested under this one at any depth. Counted rather than just the direct
     children, because the change count beside it is the whole subtree's - "+9 open in 2
     sub-products" when nine of them live in a grandchild would be quietly wrong about
     where the work is. */
  function groupDescendants(group) {
    return (group.subgroups || []).flatMap((g) => [g, ...groupDescendants(g)]);
  }

  /* The sections as a flat sequence with depth, for the timeline - it draws rows on one
     shared axis, so nesting is indentation there rather than a box inside a box. A
     folded parent takes its sub-products with it: they are inside it, so they fold with
     it rather than being left behind at the top level with nothing above them. */
  function flatGroups(groups = currentGroups(), depth = 0) {
    const out = [];
    for (const group of groups) {
      out.push({ group, depth });
      if (!collapsed.has(group.key)) out.push(...flatGroups(group.subgroups || [], depth + 1));
    }
    return out;
  }

  /* Mirrors portfolio.group_changes_by_initiative on the server (see
     /roadmap/by-initiative). Done client-side so the grouping re-computes instantly on
     websocket events instead of refetching the whole board on every change made
     anywhere. Every change appears exactly once, and anything the tree doesn't reach
     lands in one trailing "Unaligned" group rather than disappearing. */
  function groupsByInitiative() {
    const initiativeOf = (change) => {
      const project = PROJECTS_BY_ID[change.project_id];
      return project && project.initiative_id ? project.initiative_id : null;
    };

    const buckets = new Map();
    for (const change of allChanges()) {
      const key = initiativeOf(change);
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(change);
    }

    const groups = PORTFOLIO.initiatives.map((initiative) => {
      const changes = buckets.get(initiative.id) || [];
      const flags = [];
      if (initiative.is_maintenance) flags.push(["always open", false]);
      if (initiative.status === "closed") flags.push(["closed", false]);
      // The product spread is the point of this grouping: it is what a per-product
      // board structurally cannot show.
      const products = new Set(changes.map((c) => c.product));
      if (products.size > 1) flags.push([`${products.size} products`, false]);
      const projects = PORTFOLIO.projects.filter((p) => p.initiative_id === initiative.id);
      return {
