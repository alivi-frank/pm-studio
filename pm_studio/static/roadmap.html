        key: `initiative:${initiative.id}`,
        kind: "initiative",
        title: initiative.title,
        flags,
        changes,
        omit: {},
        // An initiative can span products, so it names none - each project row works
        // out its own destination from the changes it holds.
        product: products.size === 1 ? [...products][0] : null,
        projectIds: projects.map((p) => p.id),
      };
    });

    const unaligned = buckets.get(null) || [];
    // Projects with no initiative belong in the trailing group whether or not anything
    // has been raised against them - an unaligned project is exactly the thing this
    // section exists to make visible.
    const looseProjects = PORTFOLIO.projects.filter((p) => !p.initiative_id);
    if (unaligned.length || looseProjects.length || !groups.length) {
      groups.push({
        key: "initiative:none",
        kind: "initiative",
        title: "Unaligned",
        flags: [["no initiative", true]],
        changes: unaligned,
        omit: {},
        product: null,
        projectIds: looseProjects.map((p) => p.id),
      });
    }
    return groups;
  }

  function currentGroups() {
    return groupBy === "initiative" ? groupsByInitiative() : groupsByProduct();
  }

  /* ---- the project level ----------------------------------------------------------

     The section's first level. A row is
       { key, project, title, changes, flags, omit, addTo, roll }
     where `project` is null for the synthetic row holding changes that belong to no
     project - shown, never hidden, because a change that fell out of the work model is
     the one you most need to see.

     `key` is scoped to the group, so the same project appearing under two products
     folds independently: opening it on one board should not open it on the other. */

  function rollup(changes) {
    const done = changes.filter((c) => c.status === "done");
    const live = changes.filter((c) => c.status === "in_progress");
    const open = changes.filter((c) => c.status !== "done");
    const overdue = open.filter((c) => c.is_overdue);
    // The window the project actually runs over, from whatever dates its changes
    // carry. Undated changes contribute nothing rather than collapsing it to today.
    let from = null;
    let to = null;
    for (const c of changes) {
      for (const iso of [c.start_at, c.target_at]) {
        const ms = dateMs(iso);
        if (ms == null) continue;
        if (from == null || ms < from) from = ms;
        if (to == null || ms > to) to = ms;
      }
    }
    return {
      total: changes.length,
      done: done.length,
      live: live.length,
      pending: open.length - live.length,
      open: open.length,
      overdue: overdue.length,
      now: open.filter((c) => c.bucket === "now").length,
      from,
      to,
    };
  }

  function meter(roll) {
    const node = el("div", "meter");
    node.setAttribute("aria-hidden", "true"); // the counts beside it carry the same facts
    if (!roll.total) {
      node.appendChild(el("span", "seg empty"));
      return node;
    }
    for (const [name, count] of [["done", roll.done], ["in_progress", roll.live], ["pending", roll.pending]]) {
      if (!count) continue;
      const seg = el("span", `seg ${name}`);
      seg.style.flex = `${count} 1 0`;
      node.appendChild(seg);
    }
    node.title = `${roll.done} shipped · ${roll.live} in progress · ${roll.pending} not started`;
    return node;
  }

  function projectRows(group, changes) {
    const byProject = new Map();
    for (const change of changes) {
      const id = PROJECTS_BY_ID[change.project_id] ? change.project_id : null;
      if (!byProject.has(id)) byProject.set(id, []);
      byProject.get(id).push(change);
    }

    // The section's declared projects first, in the portfolio's own order, then
    // anything that landed here without being on that list - a change moved onto a
    // project belonging to another initiative must still be drawn somewhere.
    const ids = group.projectIds
      ? group.projectIds.filter((id) => PROJECTS_BY_ID[id])
      : PORTFOLIO.projects.filter((p) => byProject.has(p.id)).map((p) => p.id);
    for (const id of byProject.keys()) {
      if (id !== null && !ids.includes(id)) ids.push(id);
    }

    const row = (project, rowChanges) => {
      const flags = [];
      if (project && project.is_catch_all) flags.push(["catch-all", false]);
      if (project && project.status === "closed") flags.push(["closed", false]);
      if (project && project.is_unaligned && groupBy === "product") flags.push(["no initiative", true]);
      const products = new Set(rowChanges.map((c) => c.product));
      if (!group.product && products.size > 1) flags.push([`${products.size} products`, false]);

      /* Where a "+" in this row would put a change. The project is known by
         construction; the product is the section's when it has one, the changes' when
         they agree on one, and the deployment's when it only has one board at all.
         Anything else is a guess, so the row shows no "+" instead. */
      const productIds = Object.keys(PRODUCTS);
      const product = group.product
        || (products.size === 1 ? [...products][0] : null)
        || (productIds.length === 1 ? productIds[0] : null);

      return {
        key: `${group.key}/project:${project ? project.id : "none"}`,
        project,
        title: project ? project.title : "No project",
        changes: rowChanges,
        flags,
        // The row already names the project, so its changes don't repeat it - the same
        // trick the section head plays with the product.
        omit: { ...group.omit, project: true },
        addTo: product ? { product, projectId: project ? project.id : null } : null,
        roll: rollup(rowChanges),
      };
    };

    const rows = ids.map((id) => row(PROJECTS_BY_ID[id], byProject.get(id) || []));
    if (byProject.has(null)) rows.push(row(null, byProject.get(null)));
    return rows;
  }

  // ---- the now / next / later view ----

  /* The lanes now belong to ONE project rather than to a whole section, so `row` is a
     project row - but the shape it needs ({ changes, omit, addTo }) is the same one a
     group had, and untriaged suggestions have already been lifted out of it by
     renderBoard. */
  function renderLanes(row, container) {
    const open = row.changes.filter((i) => i.status !== "done");

    const lanes = el("div", "lanes");
    for (const [value, label] of BUCKETS) {
      const items = open
        .filter((i) => i.bucket === value)
        // Soonest commitment first, undated work after it - so a date changes what you
        // see in this view too, not only on the timeline. ISO dates sort as strings.
        .sort((a, b) =>
          (a.target_at ? 0 : 1) - (b.target_at ? 0 : 1)
          || (a.target_at || "").localeCompare(b.target_at || "")
          || a.created_at - b.created_at);
      const lane = el("div", "lane");

      const head = el("div", "lane-head");
      head.appendChild(el("h3", null, label));
      head.appendChild(el("span", "n", String(items.length)));
      lane.appendChild(head);

      if (row.addTo) {
        const form = addForm(row.addTo.product, value, row.addTo.projectId);
        const add = el("button", "add-btn", "+");
        add.type = "button";
        add.title = `Add a change to ${label}`;
        add.addEventListener("click", () => form.classList.toggle("open"));
        head.appendChild(add);
        lane.appendChild(form);
      }

      if (!items.length) lane.appendChild(el("div", "lane-empty", "—"));
      for (const item of items) lane.appendChild(itemCard(item, row.omit));
      lanes.appendChild(lane);
    }
    container.appendChild(lanes);

    const shipped = row.changes
      .filter((i) => i.status === "done")
      .sort((a, b) => (b.shipped_at ?? b.updated_at) - (a.shipped_at ?? a.updated_at))
      .slice(0, 8);
    if (shipped.length) {
      const details = el("details", "shipped");
      details.appendChild(el("summary", null, `Recently shipped (${shipped.length})`));
      const list = el("div", "shipped-list");
      for (const item of shipped) {
        const line = el("div", "shipped-item");
        line.appendChild(el("span", "when", relativeTime(item.shipped_at ?? item.updated_at)));
        line.appendChild(el("span", null, item.title));
        list.appendChild(line);
      }
      details.appendChild(list);
      container.appendChild(details);
    }
  }

  /* One project row: the strategic line, with the whole Now / Next / Later board for
     that project folded inside it. */
  function projectNode(row) {
    const isOpen = openProjects.has(row.key);
    const node = el("article", "project" + (isOpen ? " open" : ""));

    const head = el("button", "project-head");
    head.type = "button";
    head.setAttribute("aria-expanded", String(isOpen));
    head.appendChild(el("span", "chevron", "▾"));
    head.appendChild(kindIcon(row.project ? "project" : "loose"));
    head.appendChild(el("span", "project-name" + (row.project ? "" : " loose"), row.title));
    for (const [text, warn] of row.flags) head.appendChild(chip(text, warn ? "warn" : null));
    // The one flag that isn't about the project's shape but about its health, so it is
    // the one that gets a fill.
    if (row.roll.overdue) head.appendChild(chip(`${row.roll.overdue} overdue`, "late"));
    if (row.roll.from != null) {
      head.appendChild(chip(
        row.roll.from === row.roll.to
          ? dateLabelMs(row.roll.from)
          : `${dateLabelMs(row.roll.from)} → ${dateLabelMs(row.roll.to)}`,
        "dates"));
    }

    const stats = el("div", "project-stats");
    stats.appendChild(meter(row.roll));
    if (row.roll.total) {
      stats.appendChild(el("span", null, `${row.roll.done}/${row.roll.total} shipped`));
      if (row.roll.live) stats.appendChild(el("span", "live", `${row.roll.live} in progress`));
      stats.appendChild(el("span", null, `${row.roll.now} now`));
    } else {
      stats.appendChild(el("span", null, "no changes yet"));
    }
    head.appendChild(stats);

    head.addEventListener("click", () => {
      const nowOpen = !openProjects.has(row.key);
      if (nowOpen) openProjects.add(row.key); else openProjects.delete(row.key);
      node.classList.toggle("open", nowOpen);
      head.setAttribute("aria-expanded", String(nowOpen));
      persistOpenProjects();
    });
    node.appendChild(head);

    const body = el("div", "project-body");
    // Built even while folded: a project holds a handful of changes, and rebuilding
    // them on every toggle would drop any card the user had opened inside.
    if (!row.roll.total && !row.addTo) {
      body.appendChild(el("div", "project-empty", "Nothing raised against this project yet."));
    } else {
      renderLanes(row, body);
    }
    node.appendChild(body);
    return node;
  }

  /* One section, with its sub-product sections drawn inside its own body. The parent's
     OWN project rows come first and the children follow, so a parent reads as "here is
     what I run directly, and here is each sub-product below it" - one place to look for
     the family, at whatever depth the taxonomy declared. */
  function groupSection(group, depth) {
    const section = el("section", "group" + (depth ? " sub" : ""));
    if (collapsed.has(group.key)) section.classList.add("collapsed");

    const head = el("button", "group-head");
    head.type = "button";
    head.setAttribute("aria-expanded", String(!collapsed.has(group.key)));
    head.appendChild(el("span", "chevron", "▾"));
    head.appendChild(kindIcon(groupKind(group, depth)));
    head.appendChild(el("h2", null, group.title));
    // Owner/team as the heading's tooltip: context on demand, not a row of chrome.
    if (group.product && PRODUCT_META[group.product]) {
      const m = PRODUCT_META[group.product];
      const facts = [m.owner && `Owner: ${m.owner}`, m.team && `Team: ${m.team}`,
                     m.description].filter(Boolean).join(" · ");
      if (facts) head.title = facts;
    }
    for (const [text, warn] of group.flags) head.appendChild(chip(text, warn ? "warn" : null));

    /* Untriaged cross-product suggestions are lifted to the section, not filed under
       a project: nobody has accepted them onto this board yet, so claiming they are
       part of a project's plan would be putting them in the plan by drawing them. */
    const suggestions = group.changes.filter(
      (i) => i.status !== "done" && i.origin_product !== i.product && !i.triaged);
    const suggested = new Set(suggestions.map((i) => i.id));
    const planned = group.changes.filter((i) => !suggested.has(i.id));
    const rows = projectRows(group, planned);

    const open = planned.filter((i) => i.status !== "done");
    const live = open.filter((i) => i.status === "in_progress").length;
    const subgroups = group.subgroups || [];
    const tally = el("div", "tally");
    // Projects first: the section's headline is now how many bets it is running, and
    // the change counts are the size of them.
    tally.appendChild(el("span", null, `${rows.length} project${rows.length === 1 ? "" : "s"}`));
    tally.appendChild(el("span", null, `${open.length} open`));
    if (live) tally.appendChild(el("span", "live", `${live} in progress`));
    if (suggestions.length) tally.appendChild(el("span", null, `${suggestions.length} to triage`));
    if (subgroups.length) {
      // Counted separately from the section's own numbers rather than folded into them:
      // "4 open" that silently included three sub-products' work would misreport what
      // this board is running, and the whole point of the nesting is that both are true
      // at once. Folded shut, this is what says the family is not empty.
      const nested = groupDescendants(group);
      const nestedOpen = subgroups
        .flatMap(groupChanges)
        .filter((i) => i.status !== "done").length;
      tally.appendChild(el("span", "nested",
        `+${nestedOpen} open in ${nested.length} sub-product${nested.length === 1 ? "" : "s"}`));
    }
    head.appendChild(tally);

    head.addEventListener("click", () => {
      const nowCollapsed = section.classList.toggle("collapsed");
      if (nowCollapsed) collapsed.add(group.key); else collapsed.delete(group.key);
      head.setAttribute("aria-expanded", String(!nowCollapsed));
      persistCollapsed();
      // The nav's collapse-all label is a function of every section's state.
      const slot = document.getElementById("pm-nav-slot");
      if (slot) mountControls(slot);
    });
    section.appendChild(head);

    const body = el("div", "group-body");
    if (suggestions.length) {
      const triage = el("div", "triage");
      for (const item of suggestions) triage.appendChild(suggestionCard(item));
      body.appendChild(triage);
    }
    if (rows.length) {
      const list = el("div", "projects");
      for (const row of rows) list.appendChild(projectNode(row));
      body.appendChild(list);
    } else if (!suggestions.length && !subgroups.length) {
      // Said only when there is genuinely nothing here. A parent whose work all lives in
      // its sub-products is not empty, and the sections below say so themselves.
      body.appendChild(el("div", "project-empty", "No projects or changes here yet."));
    }
    if (subgroups.length) {
      const nested = el("div", "subgroups");
      for (const sub of subgroups) nested.appendChild(groupSection(sub, depth + 1));
      body.appendChild(nested);
    }
    section.appendChild(body);
    return section;
  }

  function renderBoard() {
    for (const group of currentGroups()) board.appendChild(groupSection(group, 0));
  }

  /* ---- the timeline view ----------------------------------------------------------

     A change may carry real dates (`start_at` / `target_at`) and may not - both are
     optional, on purpose, because the board's own unit of planning is the Now / Next /
     Later horizon and a change nobody has committed to a date for is a normal change,
     not an incomplete one. So a bar is drawn from whichever is available, and SAYS
     WHICH:

       solid    the span is real - dates the change carries, or, for a shipped change,
                the history it actually has.
       hatched  the span is derived from the horizon: "planned for roughly here". It
                must never be mistaken for a commitment.

     A diamond marks the target date. On a shipped change it stays put, so the gap
     between the end of the bar and the diamond is the slip, filled when it shipped on
     time and red when it did not. A dotted tail before a bar is how long the change has
     been sitting on the board before its span opens - the one thing a lane view cannot
     show at all. */

  function startOfQuarter(date) {
    return new Date(date.getFullYear(), Math.floor(date.getMonth() / 3) * 3, 1);
  }
  function addMonths(date, n) {
    return new Date(date.getFullYear(), date.getMonth() + n, 1);
  }

  function axis() {
    const q0 = startOfQuarter(new Date());
    // One quarter of history, then the three horizons: Now is this quarter, Next the
    // one after, Later the two beyond that. Fifteen months, which fits without
    // scrolling on a normal window and keeps a month column readable.
    return {
      start: +addMonths(q0, -3),
      end: +addMonths(q0, 12),
      bands: {
        now: [+q0, +addMonths(q0, 3)],
        next: [+addMonths(q0, 3), +addMonths(q0, 6)],
        later: [+addMonths(q0, 6), +addMonths(q0, 12)],
      },
    };
  }

  function barFor(item, ax) {
    const band = ax.bands[item.bucket] || ax.bands.later;
    const raised = item.created_at * 1000;
    const start = dateMs(item.start_at);
    const target = endOfDayMs(item.target_at);
    const lines = [];

    if (item.start_at) lines.push(`starts ${dateLabel(item.start_at)}`);
    if (item.target_at) lines.push(`target ${dateLabel(item.target_at)}`);

    if (item.status === "done") {
      const shipped = (item.shipped_at ?? item.updated_at) * 1000;
      // A shipped change is history, so the bar is measured, not planned: from when
      // work began (its own start date if it has one) to when it actually shipped.
      const from = Math.min(start ?? raised, shipped);
      if (target != null) {
        const slip = daysBetween(target, shipped);
        lines.push(slip > 0 ? `shipped ${slip}d after target` : "shipped on or before target");
      }
      return {
        start: from, end: shipped, status: "done", derived: false, tail: null, target,
        targetMet: target == null ? null : shipped <= target,
        note: [`shipped ${shortDate(shipped)}`, ...lines].join(" · "),
      };
    }

    /* Open change. Four shapes, because the missing edge has to be derived from
       something and the horizon is only the right answer when there is no date at all:

         both dates   the committed span, exactly as given.
         target only  from today to the target - "from now until due". The horizon is
                      NOT used for the left edge here: a change bucketed "next" but due
                      in three weeks would get a bar starting after it was meant to
                      finish, and the date is the sharper of the two claims.
         start only   from the start out to the end of its horizon, open-ended.
         neither      the horizon band, hatched, claiming nothing more.

       `derived` is true only in the last case - a bar with one committed edge is a
       commitment, and shading it like a guess would undersell it. */
    const today = todayMs();
    const overdue = !!item.is_overdue;
    let from, to, derived = false;
    if (start != null && target != null) {
      [from, to] = [start, target];
    } else if (target != null) {
      [from, to] = [Math.min(today, target), target];
    } else if (start != null) {
      [from, to] = [start, Math.max(band[1], today)];
    } else {
      [from, to] = [band[0], band[1]];
      derived = true;
    }
    // An overdue change keeps running to today, so the overrun past its diamond is the
    // length of the bar rather than something you have to read off the axis.
    if (overdue) to = Math.max(to, today + 86400000);

    if (derived) {
      lines.push(`${item.bucket} horizon (${shortDate(band[0])} – ${shortDate(band[1] - 1)})`);
    } else if (overdue) {
      lines.push(`OVERDUE by ${daysBetween(dateMs(item.target_at), today)}d`);
    } else if (target != null) {
      const left = daysBetween(today, dateMs(item.target_at));
      lines.push(left === 0 ? "due today" : `${left}d left`);
    }

    return {
      start: from,
      end: to,
      status: overdue ? "overdue" : item.status,
      derived,
      // Only worth drawing when the change predates the span it is waiting on.
      tail: raised < from ? [raised, from] : null,
      target,
      targetMet: null,
      note: [STATUS_LABEL[item.status], ...lines.filter(Boolean),
             `on the board since ${shortDate(raised)}`].join(" · "),
    };
  }

  function renderTimeline() {
    const ax = axis();
    const span = ax.end - ax.start;
    const pct = (t) => ((t - ax.start) / span) * 100;
    const clamp = (p) => Math.max(0, Math.min(100, p));

    // Says plainly which bars are dates and which are derived bands - the difference
    // between a commitment and a horizon is the one thing this view must not blur.
    const legend = el("div", "gantt-legend");
    const key = (swatch, text) => {
      const node = el("span", "key");
      node.appendChild(el("span", "swatch " + swatch));
      node.appendChild(el("span", null, text));
      legend.appendChild(node);
    };
    key("gantt-bar s-pending", "scheduled");
    key("gantt-bar s-in_progress", "in progress");
    key("gantt-bar s-done", "shipped");
    key("gantt-bar s-overdue", "overdue");
    key("gantt-bar s-pending derived", "no dates — horizon only");
    key("gantt-summary s-pending", "project — dated span");
    key("gantt-reach s-pending", "project — full reach");
    key("gantt-target", "target date");
    key("gantt-age", "waiting on the board");
    key("today", "today");
    board.appendChild(legend);

    const scroll = el("div", "gantt-scroll");
    const gantt = el("div", "gantt");

    // Months and quarters, positioned from real timestamps rather than as equal cells -
    // February is not the same width in time as March.
    const months = [];
    for (let d = new Date(ax.start); +d < ax.end; d = addMonths(d, 1)) months.push(new Date(d));

    const head = el("div", "gantt-head");
    head.appendChild(el("div"));

    const scale = el("div", "gantt-scale");
    for (const month of months) {
      const left = pct(+month);
      const width = pct(+addMonths(month, 1)) - left;
      if (month.getMonth() % 3 === 0) {
        const q = el("div", "gantt-quarter",
          `Q${Math.floor(month.getMonth() / 3) + 1} ${month.getFullYear()}`);
        q.style.left = left + "%";
        q.style.width = (width * 3) + "%";
        if (+month === +startOfQuarter(new Date())) q.classList.add("is-current");
        scale.appendChild(q);
      }
      const m = el("div", "gantt-month",
        month.toLocaleDateString(undefined, { month: "short" }));
      m.style.left = left + "%";
      m.style.width = width + "%";
      scale.appendChild(m);
    }
    const todayHead = el("div", "gantt-today head");
    todayHead.style.left = clamp(pct(Date.now())) + "%";
    scale.appendChild(todayHead);
    head.appendChild(scale);
    gantt.appendChild(head);

    const body = el("div", "gantt-body");
    const lines = el("div", "gantt-lines");
    lines.setAttribute("aria-hidden", "true");
    for (const month of months) {
      const line = el("div", month.getMonth() % 3 === 0 ? "q" : "m");
      line.style.left = pct(+month) + "%";
      lines.appendChild(line);
    }
    const today = el("div", "gantt-today");
    today.style.left = clamp(pct(Date.now())) + "%";
    lines.appendChild(today);
    body.appendChild(lines);

    // One change, as a row on the axis. Unchanged from before the project level
    // existed - it just no longer sits directly under a section.
    function changeRow(item, bar, omit) {
      const row = el("div", "gantt-row is-change");

      const label = el("button", "gantt-label");
      label.type = "button";
      label.setAttribute("aria-expanded", String(openCards.has(item.id)));
      const dot = el("span", `status-dot ${item.status}`);
      dot.title = STATUS_LABEL[item.status];
      label.appendChild(dot);
      label.appendChild(el("span", "name", item.title));
      if (!omit.product) label.appendChild(el("span", "sub", productPathLabel(item.product)));
      else if (item.ticket) label.appendChild(el("span", "sub", item.ticket.key));
      label.title = `${item.title}\n${bar.note}`;
      row.appendChild(label);

      const track = el("div", "gantt-track");
      if (bar.tail) {
        const tail = el("div", "gantt-age");
        const left = clamp(pct(bar.tail[0]));
        tail.style.left = left + "%";
        tail.style.width = Math.max(0, clamp(pct(bar.tail[1])) - left) + "%";
        track.appendChild(tail);
      }
      const rect = el("div", `gantt-bar s-${bar.status}` + (bar.derived ? " derived" : ""));
      const left = clamp(pct(bar.start));
      rect.style.left = left + "%";
      rect.style.width = Math.max(0.4, clamp(pct(bar.end)) - left) + "%";
      if (bar.start < ax.start) rect.classList.add("clip-start");
      if (bar.end > ax.end) rect.classList.add("clip-end");
      rect.title = bar.note;
      track.appendChild(rect);

      // Drawn even when it coincides with the bar's own right edge: on an open change
      // that is the same information twice, but on a shipped one it is the only way
      // to see that the bar stopped somewhere else.
      if (bar.target != null && bar.target > ax.start && bar.target < ax.end) {
        const mark = el("div", "gantt-target"
          + (bar.targetMet === true ? " met" : "")
          + (bar.targetMet === false || bar.status === "overdue" ? " missed" : ""));
        mark.style.left = clamp(pct(bar.target)) + "%";
        mark.title = `Target ${dateLabel(item.target_at)}`;
        track.appendChild(mark);
      }
      row.appendChild(track);

      // The same controls the lane view's card opens, in the same place: a row that
      // can be read but not changed would send you back to the other view to act.
      const detail = el("div", "gantt-detail");
      detail.hidden = !openCards.has(item.id);
      if (item.description) detail.appendChild(el("div", "desc", item.description));
      const chips = el("div", "card-meta");
      for (const node of metaChips(item, omit)) chips.appendChild(node);
      if (item.ticket) chips.appendChild(ticketBadge(item.ticket, false));
      detail.appendChild(chips);
      detail.appendChild(itemControls(item));
      row.appendChild(detail);

      label.addEventListener("click", () => {
        const nowOpen = !openCards.has(item.id);
        if (nowOpen) openCards.add(item.id); else openCards.delete(item.id);
        detail.hidden = !nowOpen;
        label.setAttribute("aria-expanded", String(nowOpen));
      });

      return row;
    }

    /* The project's own row, in two marks that say two different things:

         reach  where the project extends to once its undated changes are counted -
                the full envelope, as a dashed rule.
         span   the part of that backed by dates changes actually carry, as a solid
                capped bar. Absent when nothing in the project is dated.

       Its colour is the worst state underneath it, because at this altitude the
       question is "is this project in trouble", not "which of these nine changes is". */
    function summaryBar(bars) {
      const dated = bars.filter((b) => !b.derived);
      const status = bars.some((b) => b.status === "overdue")
        ? "overdue"
        : bars.some((b) => b.status === "in_progress")
        ? "in_progress"
        : bars.every((b) => b.status === "done")
        ? "done"
        : "pending";
      return {
        from: Math.min(...bars.map((b) => b.start)),
        to: Math.max(...bars.map((b) => b.end)),
        span: dated.length
          ? { from: Math.min(...dated.map((b) => b.start)), to: Math.max(...dated.map((b) => b.end)) }
          : null,
        undated: bars.length - dated.length,
        status,
      };
    }

    // Flat with depth, not nested: this view's whole point is one shared axis, so a
    // sub-product is an indented heading in the same column of rows rather than a box.
    for (const { group, depth } of flatGroups()) {
      const isFolded = collapsed.has(group.key);
      const header = el("button", "gantt-group" + (isFolded ? " collapsed" : "") + (depth ? " sub" : ""));
      if (depth) {
        // One step per level, set here rather than in CSS: the gutter is a fixed width the
        // rows share, so each level has to take its indent out of that same width instead
        // of pushing the axis along. A depth-N selector per level would be the alternative.
        const indent = depth * 13;
        header.style.marginLeft = `${indent}px`;
        header.style.width = `calc(var(--gutter) - ${indent}px)`;
      }
      header.type = "button";
      header.setAttribute("aria-expanded", String(!isFolded));
      const headLine = el("div", "head-line");
      headLine.appendChild(el("span", "chevron", "▾"));
      headLine.appendChild(kindIcon(groupKind(group, depth)));
      headLine.appendChild(el("h2", null, group.title));
      header.appendChild(headLine);
      const tally = el("div", "tally");
      // Same flags the lane view puts on a section head - "no initiative" or "closed"
      // must not be information you can only get by switching views.
      for (const [text, warn] of group.flags) tally.appendChild(chip(text, warn ? "warn" : null));
      const rows = projectRows(group, group.changes);
      const open = group.changes.filter((i) => i.status !== "done").length;
      tally.appendChild(el("span", null,
        `${rows.length} project${rows.length === 1 ? "" : "s"} · ` +
        `${group.changes.length} change${group.changes.length === 1 ? "" : "s"} · ${open} open`));
      // Folded, a parent's own heading is all that is left of its family, so it has to
      // say the sub-products exist - open, they say it themselves as their own headings.
      const subgroups = group.subgroups || [];
      if (subgroups.length && isFolded) {
        const nested = groupDescendants(group);
        const nestedOpen = subgroups.flatMap(groupChanges).filter((i) => i.status !== "done").length;
        tally.appendChild(el("span", "nested",
          `+${nestedOpen} open in ${nested.length} sub-product${nested.length === 1 ? "" : "s"}`));
      }
      header.appendChild(tally);
      // A full re-render, unlike the project twisty: folding a section removes a
      // variable number of rows, and rebuilding is simpler than tracking them all.
      header.addEventListener("click", () => {
        if (isFolded) collapsed.delete(group.key); else collapsed.add(group.key);
        persistCollapsed();
        renderAll();
      });
      body.appendChild(header);

      if (isFolded) continue;

      if (!rows.length) {
        // A parent that runs nothing directly is not empty - its sub-products' headings
        // come next, so saying "no changes" under it would contradict them.
        if (!subgroups.length) body.appendChild(el("div", "gantt-empty", "No changes."));
        continue;
      }

      for (const projectRow of rows) {
        // Everything on one axis, but out-of-range history would add rows that draw
        // nothing - so it is counted instead of listed.
        const drawn = [];
        let earlier = 0;
        for (const item of projectRow.changes) {
          const bar = barFor(item, ax);
          if (bar.end <= ax.start) { earlier++; continue; }
          drawn.push({ item, bar });
        }
        drawn.sort((a, b) =>
          (a.item.status === "done") - (b.item.status === "done")
          || (BUCKET_RANK[a.item.bucket] ?? 3) - (BUCKET_RANK[b.item.bucket] ?? 3)
          || a.bar.start - b.bar.start);

        const isOpen = openProjects.has(projectRow.key);
        const head = el("div", "gantt-row is-project");

        const label = el("button", "gantt-label");
        label.type = "button";
        label.setAttribute("aria-expanded", String(isOpen));
        label.appendChild(el("span", "twisty" + (isOpen ? "" : " closed"), "▾"));
        label.appendChild(kindIcon(projectRow.project ? "project" : "loose"));
        label.appendChild(el("span", "name", projectRow.title));
        const roll = projectRow.roll;
        label.appendChild(el("span", "count", `${roll.done}/${roll.total}`));
        label.appendChild(meter(roll));
        label.title =
          `${projectRow.title} — ${roll.total} change${roll.total === 1 ? "" : "s"}, ` +
          `${roll.done} shipped, ${roll.live} in progress` +
          (roll.overdue ? `, ${roll.overdue} overdue` : "") +
          (earlier ? `\n${earlier} shipped before ${shortDate(ax.start)}` : "");
        head.appendChild(label);

        const track = el("div", "gantt-track");
        if (drawn.length) {
          const sum = summaryBar(drawn.map((d) => d.bar));
          const note = `${projectRow.title}\n` +
            (sum.span
              ? `dated ${shortDate(sum.span.from)} – ${shortDate(sum.span.to)}`
              : "nothing dated — horizon only") +
            (sum.undated ? `\nreaches ${shortDate(sum.to)} with ${sum.undated} undated change${sum.undated === 1 ? "" : "s"}` : "");

          const reach = el("div", `gantt-reach s-${sum.status}`);
          const reachLeft = clamp(pct(sum.from));
          reach.style.left = reachLeft + "%";
          reach.style.width = Math.max(0.4, clamp(pct(sum.to)) - reachLeft) + "%";
          reach.title = note;
          track.appendChild(reach);

          if (sum.span) {
            const rect = el("div", `gantt-summary s-${sum.status}`);
            const left = clamp(pct(sum.span.from));
            rect.style.left = left + "%";
            rect.style.width = Math.max(0.4, clamp(pct(sum.span.to)) - left) + "%";
            rect.title = note;
            track.appendChild(rect);
          }
        }
        head.appendChild(track);
        body.appendChild(head);

        const childRows = drawn.map(({ item, bar }) => {
          const node = changeRow(item, bar, projectRow.omit);
          node.hidden = !isOpen;
          return node;
        });
        for (const node of childRows) body.appendChild(node);

        const note = earlier
          ? el("div", "gantt-empty", `+ ${earlier} shipped before ${shortDate(ax.start)}.`)
          : !drawn.length
          ? el("div", "gantt-empty", "Nothing in range.")
          : null;
        if (note) {
          note.hidden = !isOpen;
          body.appendChild(note);
        }

        label.addEventListener("click", () => {
          const nowOpen = !openProjects.has(projectRow.key);
          if (nowOpen) openProjects.add(projectRow.key); else openProjects.delete(projectRow.key);
          for (const node of childRows) node.hidden = !nowOpen;
          if (note) note.hidden = !nowOpen;
          label.firstChild.classList.toggle("closed", !nowOpen);
          label.setAttribute("aria-expanded", String(nowOpen));
          persistOpenProjects();
        });
      }
    }

    gantt.appendChild(body);
    scroll.appendChild(gantt);
    board.appendChild(scroll);
  }

  // ---- render ----

  /* The restructure banner: a count, and the page that fixes it. Deliberately a pointer
     rather than a second copy of the attribute-each-one controls - those live on the cards
     (itemControls) and on the systems page, and a third place to do the same write would
     be a third place to keep in step. Absent entirely once nothing is unattributed. */
  function renderUnattributedBar() {
    const bar = document.getElementById("unattributed-bar");
    bar.textContent = "";
    const count = systemsDeclared() ? (UNATTRIBUTED.count || 0) : 0;
    bar.className = count ? "visible" : "";
    if (!count) return;
    bar.appendChild(el("span", null,
      `${count} change${count === 1 ? "" : "s"} not yet attributed to a system`));
    const link = el("a", null, "Review on the systems page →");
    link.href = "/systems";
    bar.appendChild(link);
  }

  function renderAll() {
    board.textContent = "";
    renderUnattributedBar();
    const slot = document.getElementById("pm-nav-slot");
    if (slot) mountControls(slot);

    if (!Object.keys(PRODUCTS).length) {
      board.appendChild(el("p", "lens-empty", "No products are configured."));
      return;
    }
    if (groupBy === "initiative" && !PORTFOLIO.initiatives.length && !allChanges().length) {
      const empty = el("p", "lens-empty");
      empty.innerHTML =
        'No goals, initiatives or projects yet — set them up on the '
        + '<a href="/portfolio">portfolio page</a>, and changes will group here.';
      board.appendChild(empty);
      return;
    }
    if (view === "timeline") renderTimeline(); else renderBoard();
  }

  function upsertItem(item) {
    const list = itemsByProduct[item.product] ?? (itemsByProduct[item.product] = []);
    const idx = list.findIndex((i) => i.id === item.id);
    if (idx >= 0) list[idx] = item; else list.push(item);
    renderAll();
  }

  function removeItem(product, id) {
    const list = itemsByProduct[product];
    if (!list) return;
    itemsByProduct[product] = list.filter((i) => i.id !== id);
    renderAll();
  }

  function loadBoard() {
    return fetch("/roadmap/data")
      .then((r) => r.json())
      .then((data) => {
        PRODUCTS = data.products;
        PRODUCT_PARENTS = data.product_parents || {};
        SYSTEMS = data.systems || {};
        PRODUCT_SYSTEMS = data.product_systems || {};
        PRODUCT_META = data.product_meta || {};
        UNATTRIBUTED = data.unattributed || UNATTRIBUTED;
        itemsByProduct = data.items;
        PORTFOLIO = data.portfolio || PORTFOLIO;
        TRACKERS = data.trackers || TRACKERS;
        indexProjects();
        renderTrackerBar();
        renderAll();
      });
  }

  // ---- tracker sync status ----

  function renderTrackerBar() {
    const bar = document.getElementById("tracker-bar");
    bar.classList.toggle("visible", !!TRACKERS.configured);
    if (!TRACKERS.configured) return;
    bar.textContent = "";

    for (const tracker of TRACKERS.trackers) {
      const status = tracker.status;
      // Three states, each explicit: synced, failed, never synced. A tracker that has
      // never run must not look the same as one holding zero tickets.
      const state = !status || (!status.ok && !status.error)
        ? "never"
        : status.error
        ? "failed"
        : "ok";
      const chipEl = el("span", `tracker-chip ${state}`);
      chipEl.appendChild(el("span", "dot", state === "ok" ? "●" : state === "failed" ? "▲" : "○"));

      let text;
      if (!tracker.usable) {
        text = `${tracker.label} — not configured: ${tracker.unusable_reason}`;
        chipEl.className = "tracker-chip failed";
      } else if (state === "failed") {
        text = `${tracker.label} — sync failed: ${status.error}`;
      } else if (state === "never") {
        text = `${tracker.label} — not synced yet`;
      } else {
        const when = relativeTime(status.finished_at);
        text =
          `${tracker.label} — ${tracker.ticket_count} ticket${tracker.ticket_count === 1 ? "" : "s"}` +
          (when ? `, synced ${when}` : "") +
          (status.truncated ? " (capped — only the most recently changed were pulled)" : "");
      }
      chipEl.appendChild(el("span", null, text));
      bar.appendChild(chipEl);

      // The last import pass, for a tracker that routes: what landed, and which
      // components had importable tickets nobody has routed yet - named, so the fix
      // is a config line rather than an investigation. Silent when routing is off.
      const imp = (TRACKERS.imports || {})[tracker.id];
      if (imp) {
        if (imp.imported) {
          bar.appendChild(el("span", "tracker-chip ok", `↳ imported ${imp.imported} change${imp.imported === 1 ? "" : "s"}`));
        }
        if (imp.unrouted_total) {
          const c = el("span", "tracker-chip never",
            `↳ ${imp.unrouted_total} importable ticket${imp.unrouted_total === 1 ? "" : "s"} with no route`);
          c.title = Object.entries(imp.unrouted).map(([k, n]) => `${k}: ${n}`).join("\n");
          bar.appendChild(c);
        }
      }
    }

    const button = el("button", null, TRACKERS.syncing ? "Syncing…" : "Sync now");
    button.type = "button";
    button.disabled = !!TRACKERS.syncing;
    button.addEventListener("click", () => {
      button.disabled = true;
      button.textContent = "Syncing…";
      fetch("/trackers/sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
        .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
        .then(({ ok, body }) => {
          if (!ok) {
            button.disabled = false;
            button.textContent = "Sync now";
            alert(body.detail || "Could not start a sync.");
            return;
          }
          TRACKERS = body.trackers ? body : TRACKERS;
          // The finished state arrives on the roadmap socket as `trackers_synced`.
        })
        .catch(() => {
          button.disabled = false;
          button.textContent = "Sync now";
        });
    });
    bar.appendChild(button);
  }

  // ---- link picker ----

  const picker = document.getElementById("ticket-picker");
  const pickerInput = document.getElementById("picker-input");
  const pickerResults = document.getElementById("picker-results");
  const pickerNote = document.getElementById("picker-note");
  const pickerSub = document.getElementById("picker-sub");
  const pickerUnlink = document.getElementById("picker-unlink");
  const pickerLink = document.getElementById("picker-link");
  let pickerItem = null;
  let searchTimer = null;

  function openTicketPicker(item) {
    pickerItem = item;
    pickerInput.value = "";
    pickerNote.textContent = "";
    pickerNote.classList.remove("error");
    pickerSub.textContent = item.ticket
      ? `"${item.title}" is linked to ${item.ticket.key}. Pick another ticket to move the link, or unlink it.`
      : `Link "${item.title}" to one ticket. A ticket can belong to one change only.`;
    pickerUnlink.classList.toggle("hidden", !item.ticket);
    picker.classList.add("open");
    pickerInput.focus();
    searchTickets("");
  }

  function closeTicketPicker() {
    picker.classList.remove("open");
    pickerItem = null;
    pickerResults.textContent = "";
  }

  function searchTickets(query) {
    fetch(`/trackers/tickets?q=${encodeURIComponent(query)}&limit=50`)
      .then((r) => r.json())
      .then(({ tickets }) => {
        pickerResults.textContent = "";
        if (!tickets.length) {
          pickerResults.appendChild(el("div", "lens-empty",
            TRACKERS.trackers.some((t) => t.ticket_count)
              ? "No synced ticket matches that. You can still paste a full URL or key above."
              : "Nothing synced yet — run a sync, or paste a ticket URL or key above."));
          return;
        }
        for (const ticket of tickets) {
          const row = el("button", "picker-row");
          row.type = "button";
          row.appendChild(ticketBadge({ ...ticket, url: "" }, false));
          row.appendChild(el("span", "row-title", ticket.title || "(no title)"));
          // Already-linked tickets are shown but unpickable: seeing that PROJ-12 is taken
          // is more useful than it silently missing from the list.
          const alreadyThis = pickerItem && pickerItem.ticket && pickerItem.ticket.key === ticket.key
            && pickerItem.ticket.tracker_id === ticket.tracker_id;
          if (ticket.linked && !alreadyThis) {
            row.appendChild(el("span", "row-taken", "linked elsewhere"));
            row.disabled = true;
          } else if (alreadyThis) {
            row.appendChild(el("span", "row-taken", "current"));
          }
          row.addEventListener("click", () => submitLink({ tracker_id: ticket.tracker_id, ticket_key: ticket.key }));
          pickerResults.appendChild(row);
        }
      })
      .catch(() => {});
  }

  function submitLink(payload) {
    if (!pickerItem) return;
    pickerNote.textContent = "Linking…";
    pickerNote.classList.remove("error");
    pickerLink.disabled = true;
    fetch(`/roadmap/${pickerItem.product}/items/${pickerItem.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then(({ ok, body }) => {
        pickerLink.disabled = false;
        if (!ok) {
          // The 409 body names the change already holding the ticket, which is the whole
          // point of surfacing it here rather than just saying "conflict".
          pickerNote.textContent = body.detail || "Could not link that ticket.";
          pickerNote.classList.add("error");
          return;
        }
        closeTicketPicker();
        // The board updates itself from the roadmap websocket's upsert event.
      })
      .catch(() => {
        pickerLink.disabled = false;
        pickerNote.textContent = "Could not reach the server.";
        pickerNote.classList.add("error");
      });
  }

  pickerInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => searchTickets(pickerInput.value.trim()), 150);
  });
  pickerInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      pickerLink.click();
    }
  });
  // The typed value is sent as `ticket`, which the server resolves from a URL or a bare
  // key against the configured trackers (see _apply_ticket_link).
  pickerLink.addEventListener("click", () => {
    const raw = pickerInput.value.trim();
    if (!raw) {
      pickerNote.textContent = "Paste a ticket URL or key, or pick one from the list.";
      pickerNote.classList.add("error");
      return;
    }
    submitLink({ ticket: raw });
  });
  pickerUnlink.addEventListener("click", () => submitLink({ ticket: "" }));
  document.getElementById("picker-cancel").addEventListener("click", closeTicketPicker);
  picker.addEventListener("click", (event) => {
    if (event.target === picker) closeTicketPicker();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && picker.classList.contains("open")) closeTicketPicker();
  });

  loadBoard();

  const ws = new WebSocket(`ws://${location.host}/ws/roadmap`);
  ws.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    if (event.type === "roadmap_item_upserted") upsertItem(event.item);
    if (event.type === "roadmap_item_deleted") removeItem(event.product, event.id);
    // A project being re-parented or an initiative closing changes how this board
    // groups, but says nothing about the items themselves - so refetch rather than
    // trying to patch the work model incrementally.
    if (event.type === "portfolio_changed") loadBoard();
    // A sync finished: statuses changed, and so did every linked card's badge, so take
    // the whole board again rather than reconciling ticket-by-ticket.
    if (event.type === "trackers_synced") loadBoard();
  };
</script>
</body>
</html>
