<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PM Studio — Roadmap</title>
<link rel="stylesheet" href="/static/nav.css" />
<script src="/static/nav.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --column: #f3f2ef;
    --ink-primary: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --border: rgba(11, 11, 11, 0.10);
    --status-pending: #898781;
    --status-in-progress: #2a78d6;
    --status-done: #0ca30c;
    --suggestion-bg: rgba(184, 134, 11, 0.12);
    --suggestion-border: #b8860b;
    --accent: #2a78d6;
    --accent-fg: #ffffff;
    --danger: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19;
      --page: #0d0d0d;
      --column: #161615;
      --ink-primary: #ffffff;
      --ink-secondary: #c3c2b7;
      --ink-muted: #898781;
      --border: rgba(255, 255, 255, 0.10);
      --status-pending: #898781;
      --status-in-progress: #3987e5;
      --status-done: #0ca30c;
      --suggestion-bg: rgba(212, 167, 44, 0.12);
      --suggestion-border: #d4a72c;
      --accent: #3987e5;
      --accent-fg: #ffffff;
      --danger: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.2em; margin: 0; }
  header p { margin: 4px 0 0; color: var(--ink-muted); font-size: 0.85em; }
  header a { color: var(--ink-secondary); font-size: 0.85em; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  section.product {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
  }
  .product-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
  }
  .product-head h2 {
    margin: 0;
    font-size: 1.05em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .product-head .chevron {
    display: inline-block;
    font-size: 0.8em;
    color: var(--ink-muted);
    transition: transform 0.15s ease;
  }
  section.product.collapsed .product-head .chevron { transform: rotate(-90deg); }
  .product-head .count { color: var(--ink-muted); font-size: 0.8em; }
  .product-head .inprogress-badge {
    color: var(--status-done);
    font-size: 0.75em;
    font-weight: 600;
  }
  section.product.collapsed .suggestions,
  section.product.collapsed .columns,
  section.product.collapsed details.shipped {
    display: none;
  }
  .suggestions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .suggestion-card {
    background: var(--suggestion-bg);
    border: 1px solid var(--suggestion-border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .suggestion-card .body { min-width: 0; }
  .suggestion-card .title { font-weight: 600; }
  .suggestion-card .from { font-size: 0.78em; color: var(--ink-muted); }
  .suggestion-card .desc { font-size: 0.82em; color: var(--ink-secondary); margin-top: 2px; }
  .suggestion-card .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .columns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  @media (max-width: 900px) {
    .columns { grid-template-columns: 1fr; }
  }
  .column {
    background: var(--column);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 60px;
  }
  .column-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .column-head h3 {
    margin: 0;
    font-size: 0.85em;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-secondary);
  }
  .add-btn {
    border: none;
    background: transparent;
    color: var(--ink-muted);
    font: inherit;
    font-size: 1.1em;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
  }
  .add-btn:hover { color: var(--accent); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .card .title { font-weight: 600; font-size: 0.92em; }
  .card .desc {
    margin-top: 4px;
    font-size: 0.82em;
    color: var(--ink-secondary);
    line-height: 1.35;
    white-space: pre-wrap;
  }
  .card .row {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .dot { font-size: 0.9em; line-height: 1; }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78em;
    font-weight: 600;
  }
  .status-badge.pending { color: var(--status-pending); }
  .status-badge.in_progress { color: var(--status-in-progress); }
  .status-badge.in_progress .dot { animation: pulse 1.4s ease-in-out infinite; }
  .status-badge.done { color: var(--status-done); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  select.mini, .card select {
    font: inherit;
    font-size: 0.78em;
    background: var(--page);
    color: var(--ink-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 4px;
  }
  .card .del {
    margin-left: auto;
    border: none;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    font-size: 0.78em;
  }
  .card .del:hover { color: var(--danger); }
  .card .owner-badge {
    display: inline-block;
    font-size: 0.72em;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    border: 1px solid var(--ink-muted);
    border-radius: 4px;
    padding: 0 5px;
    margin-top: 2px;
    align-self: flex-start;
  }
  .card .owner-btn,
  .card .ticket-btn {
    background: none;
    border: none;
    font: inherit;
    font-size: 0.78em;
    color: var(--ink-muted);
    cursor: pointer;
    padding: 0;
  }
  .card .owner-btn:hover,
  .card .ticket-btn:hover { color: var(--ink-secondary); }
  .empty-col { color: var(--ink-muted); font-size: 0.8em; font-style: italic; }
  details.shipped { margin-top: 14px; }
  details.shipped summary {
    cursor: pointer;
    font-size: 0.82em;
    color: var(--ink-secondary);
    user-select: none;
  }
  .shipped-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .shipped-item {
    font-size: 0.82em;
    color: var(--ink-secondary);
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .shipped-item .when { color: var(--ink-muted); font-size: 0.85em; white-space: nowrap; }
  .add-form {
    display: none;
    flex-direction: column;
    gap: 6px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .add-form.open { display: flex; }
  .add-form input, .add-form textarea {
    font: inherit;
    font-size: 0.82em;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--page);
    color: var(--ink-primary);
    resize: vertical;
  }
  .add-form .buttons { display: flex; gap: 6px; justify-content: flex-end; }
  .add-form button {
    font: inherit;
    font-size: 0.8em;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-secondary);
    cursor: pointer;
  }
  .add-form button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  /* ---- pivot toggle + the initiative lens ---- */
  #pivot-toggle { display: inline-flex; gap: 0; margin-top: 10px; }
  #pivot-toggle button {
    padding: 6px 13px;
    font: inherit;
    font-size: 0.82em;
    color: var(--ink-secondary);
    background: transparent;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  #pivot-toggle button:first-child { border-radius: 7px 0 0 7px; }
  #pivot-toggle button:last-child { border-radius: 0 7px 7px 0; border-left: 0; }
  #pivot-toggle button.active {
    color: var(--accent-fg);
    background: var(--accent);
    border-color: var(--accent);
  }
  .initiative-group { margin-bottom: 26px; }
  .initiative-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--border);
  }
  .initiative-head h2 { font-size: 1em; margin: 0; }
  .initiative-head .count { font-size: 0.78em; color: var(--ink-muted); }
  .initiative-goals { margin-top: 5px; font-size: 0.78em; color: var(--ink-muted); }
  .project-block { margin: 14px 0 0 14px; }
  .project-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 7px;
    font-size: 0.88em;
    font-weight: 600;
  }
  .project-head .count { font-weight: 400; font-size: 0.85em; color: var(--ink-muted); }
  .project-changes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 9px;
  }
  .lens-flag {
    display: inline-block;
    padding: 1px 7px;
    font-size: 0.72em;
    font-weight: 600;
    border-radius: 999px;
    color: var(--ink-muted);
    border: 1px solid var(--border);
  }
  .lens-flag.warn { color: var(--waiting-accent, #c77700); border-color: currentColor; }
  .card .product-tag {
    display: inline-block;
    margin-bottom: 5px;
    font-size: 0.72em;
    color: var(--ink-muted);
  }
  .lens-empty { font-size: 0.85em; color: var(--ink-muted); margin: 6px 0 0 14px; }

  /* ---- linked Jira / ADO ticket ----
     One palette for the canonical types trackers.py normalises onto (its CANONICAL_TYPES
     is the source of these slugs). Semantic rather than vendor-matched, because Jira and
     ADO colour the same rungs differently and a board showing both needs one consistent
     scale: epic/feature are the two "big" rungs, story/task the delivery rungs, bug is the
     only red, spike is research, subtask recedes.

     Colour is never the only signal - the badge always carries the tracker's own type name
     as text, so this reads correctly in greyscale and to a colour-blind viewer. */
  .ticket-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    max-width: 100%;
    margin-top: 6px;
    padding: 2px 8px;
    border: 1px solid var(--ticket-color, var(--border));
    border-left: 3px solid var(--ticket-color, var(--border));
    border-radius: 6px;
    background: var(--ticket-bg, transparent);
    color: var(--ticket-color, var(--ink-secondary));
    font-size: 0.75em;
    font-weight: 600;
    text-decoration: none;
    line-height: 1.5;
  }
  a.ticket-badge:hover { text-decoration: underline; }
  .ticket-badge .ticket-type {
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .ticket-badge .ticket-key {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-weight: 500;
    opacity: 0.85;
    white-space: nowrap;
  }
  .ticket-badge .ticket-state {
    color: var(--ink-muted);
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* A link whose ticket wasn't in the last sync: shown, never hidden, and visibly
     different from a resolved one so "not synced yet" can't read as "type unknown". */
  .ticket-badge.unresolved {
    border-style: dashed;
    border-left-style: dashed;
    color: var(--ink-muted);
    --ticket-color: var(--ink-muted);
    --ticket-bg: transparent;
  }
  .ticket-badge[data-type="epic"]    { --ticket-color: #8b5cf6; --ticket-bg: rgba(139, 92, 246, 0.10); }
  .ticket-badge[data-type="feature"] { --ticket-color: #6366f1; --ticket-bg: rgba(99, 102, 241, 0.10); }
  .ticket-badge[data-type="story"]   { --ticket-color: #0f9d58; --ticket-bg: rgba(15, 157, 88, 0.10); }
  .ticket-badge[data-type="task"]    { --ticket-color: #2a78d6; --ticket-bg: rgba(42, 120, 214, 0.10); }
  .ticket-badge[data-type="bug"]     { --ticket-color: #d03b3b; --ticket-bg: rgba(208, 59, 59, 0.10); }
  .ticket-badge[data-type="spike"]   { --ticket-color: #b8860b; --ticket-bg: rgba(184, 134, 11, 0.12); }
  .ticket-badge[data-type="subtask"] { --ticket-color: #6b7280; --ticket-bg: rgba(107, 114, 128, 0.10); }
  .ticket-badge[data-type="other"]   { --ticket-color: #898781; --ticket-bg: rgba(137, 135, 129, 0.10); }
  @media (prefers-color-scheme: dark) {
    .ticket-badge[data-type="epic"]    { --ticket-color: #a78bfa; --ticket-bg: rgba(167, 139, 250, 0.16); }
    .ticket-badge[data-type="feature"] { --ticket-color: #818cf8; --ticket-bg: rgba(129, 140, 248, 0.16); }
    .ticket-badge[data-type="story"]   { --ticket-color: #34d399; --ticket-bg: rgba(52, 211, 153, 0.15); }
    .ticket-badge[data-type="task"]    { --ticket-color: #3987e5; --ticket-bg: rgba(57, 135, 229, 0.18); }
    .ticket-badge[data-type="bug"]     { --ticket-color: #e66767; --ticket-bg: rgba(230, 103, 103, 0.16); }
    .ticket-badge[data-type="spike"]   { --ticket-color: #d4a72c; --ticket-bg: rgba(212, 167, 44, 0.16); }
    .ticket-badge[data-type="subtask"] { --ticket-color: #9ca3af; --ticket-bg: rgba(156, 163, 175, 0.14); }
    .ticket-badge[data-type="other"]   { --ticket-color: #a8a6a0; --ticket-bg: rgba(168, 166, 160, 0.14); }
  }

  /* Sync status strip in the page header. */
  #tracker-bar {
    display: none;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 0.8em;
    color: var(--ink-muted);
  }
  #tracker-bar.visible { display: flex; }
  #tracker-bar button {
    font: inherit;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink-secondary);
    cursor: pointer;
  }
  #tracker-bar button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #tracker-bar button:disabled { opacity: 0.6; cursor: default; }
  .tracker-chip { display: inline-flex; align-items: center; gap: 5px; }
  .tracker-chip .dot { font-size: 0.9em; line-height: 1; }
  .tracker-chip.ok .dot { color: var(--status-done); }
  .tracker-chip.failed { color: var(--danger); }
  .tracker-chip.failed .dot { color: var(--danger); }
  .tracker-chip.never .dot { color: var(--ink-muted); }

  /* Link picker: a plain modal, consistent with the board's prompt-driven controls. */
  #ticket-picker {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.45);
    align-items: flex-start;
    justify-content: center;
    padding: 8vh 16px 16px;
  }
  #ticket-picker.open { display: flex; }
  #ticket-picker .sheet {
    width: min(620px, 100%);
    max-height: 74vh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  #ticket-picker h2 { margin: 0 0 4px; font-size: 1em; }
  #ticket-picker .sub { margin: 0 0 12px; font-size: 0.82em; color: var(--ink-muted); }
  #ticket-picker input[type="text"] {
    width: 100%;
    padding: 9px 11px;
    font: inherit;
    font-size: 0.9em;
    color: var(--ink-primary);
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 7px;
  }
  #picker-results {
    flex: 1;
    overflow-y: auto;
    margin: 12px -4px 0;
    padding: 0 4px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .picker-row {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--page);
    font: inherit;
    font-size: 0.85em;
    color: var(--ink-primary);
    text-align: left;
    cursor: pointer;
  }
  .picker-row:hover:not(:disabled) { border-color: var(--accent); }
  .picker-row:disabled { opacity: 0.5; cursor: not-allowed; }
  .picker-row .row-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker-row .row-taken { font-size: 0.85em; color: var(--ink-muted); white-space: nowrap; }
  #picker-note { margin-top: 10px; font-size: 0.8em; color: var(--ink-muted); }
  #picker-note.error { color: var(--danger); }
  #ticket-picker .sheet-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  /* Matches .add-form's button treatment rather than inventing a second one. */
  #ticket-picker .sheet-actions button {
    font: inherit;
    font-size: 0.85em;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-secondary);
    cursor: pointer;
  }
  #ticket-picker .sheet-actions button.primary {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
  }
  #ticket-picker .sheet-actions button:disabled { opacity: 0.55; cursor: default; }
  #picker-unlink { margin-right: auto; }
  #picker-unlink.hidden { display: none; }
</style>
</head>
<body>
<div id="pm-nav" data-page="roadmap"></div>
<header>
  <h1>Product Roadmap</h1>
  <p id="subtitle">Now / Next / Later per product &middot; status tracked independently &middot; cross-product suggestions flagged for triage</p>
  <!-- Two lenses on one dataset: group by product, or walk the work model. -->
  <div id="pivot-toggle">
    <button type="button" data-lens="product" class="active">By product</button>
    <button type="button" data-lens="initiative">By initiative</button>
  </div>
  <!-- Shown only when the deployment configured [[trackers]]; otherwise the header looks
       exactly as it did before Jira/ADO linking existed. -->
  <div id="tracker-bar"></div>
</header>
<main id="main"></main>
<div id="ticket-picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
  <div class="sheet">
    <h2 id="picker-title">Link a ticket</h2>
    <p class="sub" id="picker-sub"></p>
    <input id="picker-input" type="text" autocomplete="off"
           placeholder="Search synced tickets, or paste a ticket URL / key" />
    <div id="picker-results"></div>
    <div id="picker-note"></div>
    <div class="sheet-actions">
      <button type="button" class="ghost" id="picker-unlink">Unlink</button>
      <button type="button" class="ghost" id="picker-cancel">Cancel</button>
      <button type="button" class="primary" id="picker-link">Link</button>
    </div>
  </div>
</div>
<script>
  const main = document.getElementById("main");

  const BUCKETS = [["now", "Now"], ["next", "Next"], ["later", "Later"]];
  const STATUS_BADGE = {
    pending: { dot: "○", label: "Pending" },
    in_progress: { dot: "●", label: "In progress" },
    done: { dot: "✓", label: "Done" },
  };

  let PRODUCTS = {};
  let itemsByProduct = {}; // product -> [item]
  // The work model, used only by the initiative lens. Empty on a deployment that
  // doesn't use /portfolio, in which case that lens shows everything as unassigned.
  let PORTFOLIO = { initiatives: [], projects: [], catch_all_project_id: null };
  // External trackers (see trackers.py). `configured: false` on a deployment with no
  // [[trackers]] block, which hides every ticket control on this page.
  let TRACKERS = { configured: false, syncing: false, trackers: [], last_sync_at: null };

  // Which lens is showing. Persisted so switching pages doesn't reset it.
  let lens = localStorage.getItem("roadmapLens") === "initiative" ? "initiative" : "product";

  // Which product sections are collapsed - kept outside the DOM (and in
  // localStorage) because renderAll() rebuilds every section from scratch on
  // every websocket event; without this, a fold would reset the instant anyone
  // else touched the board.
  const collapsedProducts = new Set(JSON.parse(localStorage.getItem("roadmapCollapsed") || "[]"));

  function persistCollapsed() {
    localStorage.setItem("roadmapCollapsed", JSON.stringify([...collapsedProducts]));
  }

  function relativeTime(seconds) {
    if (!seconds) return "";
    const diff = Date.now() / 1000 - seconds;
    if (diff < 60) return "just now";
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    if (diff < 86400 * 30) return `${Math.floor(diff / 86400)}d ago`;
    return new Date(seconds * 1000).toLocaleDateString();
  }

  // ---- linked tickets (Jira / Azure DevOps) ----

  function ticketBadge(ticket) {
    // An <a> when we know the URL, a <span> when we don't - a badge that looks clickable
    // and goes nowhere is worse than one that plainly isn't a link yet.
    const el = document.createElement(ticket.url ? "a" : "span");
    el.className = "ticket-badge" + (ticket.unresolved ? " unresolved" : "");
    el.dataset.type = ticket.type || "other";
    if (ticket.url) {
      el.href = ticket.url;
      el.target = "_blank";
      el.rel = "noopener noreferrer";
    }

    const type = document.createElement("span");
    type.className = "ticket-type";
    // The tracker's OWN name for the type, not our normalised slug: a team that renamed
    // "Story" to "Deliverable" should see "Deliverable". The slug only picks the colour.
    type.textContent = ticket.unresolved ? "Not synced" : (ticket.raw_type || "Ticket");
    el.appendChild(type);

    const key = document.createElement("span");
    key.className = "ticket-key";
    key.textContent = ticket.key;
    el.appendChild(key);

    if (ticket.state) {
      const state = document.createElement("span");
      state.className = "ticket-state";
      state.textContent = ticket.state;
      el.appendChild(state);
    }

    el.title = ticket.unresolved
      ? `${ticket.key} is linked in ${ticket.tracker_label || ticket.tracker_id} but was not in the last sync. ` +
        `It may be new, outside the configured projects, or the tracker may be unreachable.`
      : `${ticket.raw_type} ${ticket.key} — ${ticket.title || "(no title)"}\n` +
        `${ticket.tracker_label || ticket.tracker_id}${ticket.state ? " · " + ticket.state : ""}`;
    return el;
  }

  function itemCard(item, opts = {}) {
    const card = document.createElement("div");
    card.className = "card";
    const badge = STATUS_BADGE[item.status] ?? STATUS_BADGE.pending;
    card.innerHTML = `
      <div class="title"></div>
      ${item.owner ? `<span class="owner-badge"></span>` : ""}
      ${item.description ? `<div class="desc"></div>` : ""}
      <div class="row">
        <span class="status-badge ${item.status}"><span class="dot">${badge.dot}</span>${badge.label}</span>
        <select class="mini status-select"></select>
        <select class="mini bucket-select"></select>
        <select class="mini move-select"></select>
        <button type="button" class="owner-btn" title="Track work done by another person or team">Owner…</button>
        ${TRACKERS.configured ? `<button type="button" class="ticket-btn"></button>` : ""}
        <button type="button" class="del" title="Delete">Delete</button>
      </div>
    `;
    card.querySelector(".title").textContent = item.title;
    // In the initiative lens a group spans products, so each card says which product
    // it belongs to. In the product lens that would just repeat the section heading.
    // Inserted after innerHTML above, which would otherwise overwrite it.
    if (opts.showProduct) {
      const tag = document.createElement("span");
      tag.className = "product-tag";
      tag.textContent = PRODUCTS[item.product] || item.product;
      card.prepend(tag);
    }
    // External work: done by another person/team, tracked on this board for
    // visibility - PM agents keep its status current but never dispatch dev
    // tasks for it.
    if (item.owner) card.querySelector(".owner-badge").textContent = `External — ${item.owner}`;
    if (item.description) card.querySelector(".desc").textContent = item.description;

    // The 1:1 link to a Jira/ADO ticket. Inserted before the controls row so the badge
    // sits with the change's identity rather than among its actions.
    if (item.ticket) {
      card.querySelector(".row").before(ticketBadge(item.ticket));
    }
    const ticketBtn = card.querySelector(".ticket-btn");
    if (ticketBtn) {
      ticketBtn.textContent = item.ticket ? "Ticket…" : "Link ticket…";
      ticketBtn.title = item.ticket
        ? `Change or remove the ${item.ticket.key} link`
        : "Link this change to one Jira or Azure DevOps ticket";
      ticketBtn.addEventListener("click", () => openTicketPicker(item));
    }

    card.querySelector(".owner-btn").addEventListener("click", () => {
      const owner = prompt(
        "Who is doing this work outside PM Studio (person or team)?\nLeave blank to mark it as built here.",
        item.owner || ""
      );
      if (owner === null) return;
      patchItem(item, { owner: owner.trim() });
    });

    const statusSelect = card.querySelector(".status-select");
    for (const [value, label] of Object.entries({ pending: "Pending", in_progress: "In progress", done: "Done" })) {
      const opt = document.createElement("option");
      opt.value = value; opt.textContent = label; opt.selected = value === item.status;
      statusSelect.appendChild(opt);
    }
    statusSelect.addEventListener("change", () => patchItem(item, { status: statusSelect.value }));

    const bucketSelect = card.querySelector(".bucket-select");
    for (const [value, label] of BUCKETS) {
      const opt = document.createElement("option");
      opt.value = value; opt.textContent = label; opt.selected = value === item.bucket;
      bucketSelect.appendChild(opt);
    }
    bucketSelect.addEventListener("change", () => patchItem(item, { bucket: bucketSelect.value }));

    const moveSelect = card.querySelector(".move-select");
    const placeholder = document.createElement("option");
    placeholder.value = ""; placeholder.textContent = "Move to…";
    moveSelect.appendChild(placeholder);
    for (const [id, label] of Object.entries(PRODUCTS)) {
      if (id === item.product) continue;
      const opt = document.createElement("option");
      opt.value = id; opt.textContent = label;
      moveSelect.appendChild(opt);
    }
    moveSelect.addEventListener("change", () => {
      const target = moveSelect.value;
      if (!target) return;
      if (!confirm(`Move "${item.title}" to ${PRODUCTS[target]}? It keeps its history and lands accepted on their board.`)) {
        moveSelect.value = "";
        return;
      }
      // A stakeholder acting on the board picked the destination directly, so it
      // lands already triaged - no extra accept step. A PM's own curl-based move
      // (see agent.py) omits this and lands untriaged for the destination to review.
      patchItem(item, { move_to_product: target, triaged: true });
    });

    card.querySelector(".del").addEventListener("click", () => {
      if (!confirm(`Delete "${item.title}"?`)) return;
      fetch(`/roadmap/${item.product}/items/${item.id}`, { method: "DELETE" }).catch(() => {});
    });

    return card;
  }

  function suggestionCard(item) {
    const card = document.createElement("div");
    card.className = "suggestion-card";
    card.innerHTML = `
      <div class="body">
        <div class="title"></div>
        <div class="from"></div>
        ${item.description ? `<div class="desc"></div>` : ""}
      </div>
      <div class="actions">
        <button type="button" class="accept">Accept</button>
        <button type="button" class="dismiss">Dismiss</button>
      </div>
    `;
    card.querySelector(".title").textContent = item.title;
    card.querySelector(".from").textContent = `Suggested by ${PRODUCTS[item.origin_product] ?? item.origin_product}`;
    if (item.description) card.querySelector(".desc").textContent = item.description;
    card.querySelector(".accept").addEventListener("click", () => patchItem(item, { triaged: true }));
    card.querySelector(".dismiss").addEventListener("click", () => {
      fetch(`/roadmap/${item.product}/items/${item.id}`, { method: "DELETE" }).catch(() => {});
    });
    return card;
  }

  function patchItem(item, fields) {
    fetch(`/roadmap/${item.product}/items/${item.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    }).catch(() => {});
  }

  function addForm(product, bucket) {
    const form = document.createElement("form");
    form.className = "add-form";
    form.innerHTML = `
      <input type="text" placeholder="Title" class="title" required />
      <textarea placeholder="Description (optional)" class="desc" rows="2"></textarea>
      <input type="text" placeholder="External owner (optional — person/team doing this outside PM Studio)" class="owner" />
      <div class="buttons">
        <button type="button" class="cancel">Cancel</button>
        <button type="submit" class="primary">Add</button>
      </div>
    `;
    form.querySelector(".cancel").addEventListener("click", () => form.classList.remove("open"));
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = form.querySelector(".title").value.trim();
      if (!title) return;
      const description = form.querySelector(".desc").value.trim();
      const owner = form.querySelector(".owner").value.trim();
      fetch(`/roadmap/${product}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, description, bucket, status: "pending", owner }),
      }).then(() => {
        form.querySelector(".title").value = "";
        form.querySelector(".desc").value = "";
        form.querySelector(".owner").value = "";
        form.classList.remove("open");
      }).catch(() => {});
    });
    return form;
  }

  function renderProduct(product) {
    const items = itemsByProduct[product] ?? [];
    const open = items.filter((i) => i.status !== "done");
    const shipped = items
      .filter((i) => i.status === "done")
      .sort((a, b) => (b.shipped_at ?? b.updated_at) - (a.shipped_at ?? a.updated_at))
      .slice(0, 8);
    const suggestions = open.filter((i) => i.origin_product !== product && !i.triaged);

    const section = document.createElement("section");
    section.className = "product";
    section.dataset.product = product;
    if (collapsedProducts.has(product)) section.classList.add("collapsed");
    section.innerHTML = `
      <div class="product-head">
        <h2><span class="chevron">&#9662;</span><span class="name"></span><span class="inprogress-badge"></span></h2>
        <span class="count"></span>
      </div>
      <div class="suggestions"></div>
      <div class="columns"></div>
    `;
    const nowCount = open.filter((i) => i.bucket === "now").length;
    const inProgressCount = open.filter((i) => i.status === "in_progress").length;
    const nextCount = open.filter((i) => i.bucket === "next").length;

    section.querySelector(".name").textContent = PRODUCTS[product] ?? product;
    const inprogressBadge = section.querySelector(".inprogress-badge");
    if (inProgressCount > 0) {
      inprogressBadge.textContent = `${inProgressCount} in progress`;
      inprogressBadge.style.display = "";
    } else {
      inprogressBadge.style.display = "none";
    }
    section.querySelector(".count").textContent =
      `${open.length} open — ${nowCount} now · ${inProgressCount} in progress · ${nextCount} next`;
    section.querySelector(".product-head").addEventListener("click", () => {
      const nowCollapsed = section.classList.toggle("collapsed");
      if (nowCollapsed) collapsedProducts.add(product); else collapsedProducts.delete(product);
      persistCollapsed();
    });

    const suggestionsEl = section.querySelector(".suggestions");
    for (const item of suggestions) suggestionsEl.appendChild(suggestionCard(item));

    const columnsEl = section.querySelector(".columns");
    for (const [bucketValue, bucketLabel] of BUCKETS) {
      const bucketItems = open.filter((i) => i.bucket === bucketValue && !suggestions.includes(i));
      const col = document.createElement("div");
      col.className = "column";
      col.innerHTML = `
        <div class="column-head">
          <h3>${bucketLabel}</h3>
          <button type="button" class="add-btn" title="Add item">+</button>
        </div>
      `;
      const form = addForm(product, bucketValue);
      col.appendChild(form);
      col.querySelector(".add-btn").addEventListener("click", () => form.classList.toggle("open"));

      if (bucketItems.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-col";
        empty.textContent = "Nothing here.";
        col.appendChild(empty);
      } else {
        for (const item of bucketItems) col.appendChild(itemCard(item));
      }
      columnsEl.appendChild(col);
    }

    if (shipped.length > 0) {
      const details = document.createElement("details");
      details.className = "shipped";
      details.innerHTML = `<summary>Recently shipped (${shipped.length})</summary><div class="shipped-list"></div>`;
      const list = details.querySelector(".shipped-list");
      for (const item of shipped) {
        const row = document.createElement("div");
        row.className = "shipped-item";
        row.innerHTML = `<span class="when"></span><span class="title"></span>`;
        row.querySelector(".when").textContent = relativeTime(item.shipped_at ?? item.updated_at);
        row.querySelector(".title").textContent = item.title;
        list.appendChild(row);
      }
      section.appendChild(details);
    }

    return section;
  }

  // ---- the initiative lens ----

  function allChanges() {
    return Object.values(itemsByProduct).flat();
  }

  /* Mirrors portfolio.group_changes_by_initiative on the server (see
     /roadmap/by-initiative). Done client-side so the lens re-groups instantly on
     websocket events instead of refetching the whole board on every change made
     anywhere. Every change appears exactly once, and anything the tree doesn't reach
     lands in one trailing group rather than disappearing. */
  function groupByInitiative() {
    const projectsById = Object.fromEntries(PORTFOLIO.projects.map((p) => [p.id, p]));
    const byProject = new Map();
    for (const change of allChanges()) {
      const key = projectsById[change.project_id] ? change.project_id : null;
      if (!byProject.has(key)) byProject.set(key, []);
      byProject.get(key).push(change);
    }
    const entry = (project) => ({ project, changes: byProject.get(project.id) || [] });

    const groups = PORTFOLIO.initiatives.map((initiative) => ({
      initiative,
      projects: PORTFOLIO.projects
        .filter((p) => p.initiative_id === initiative.id)
        .map(entry),
    }));

    const loose = PORTFOLIO.projects.filter((p) => !p.initiative_id).map(entry);
    const unassigned = byProject.get(null) || [];
    if (unassigned.length) loose.push({ project: null, changes: unassigned });
    if (loose.length) groups.push({ initiative: null, projects: loose });
    return groups;
  }

  function flag(text, warn) {
    const span = document.createElement("span");
    span.className = warn ? "lens-flag warn" : "lens-flag";
    span.textContent = text;
    return span;
  }

  function renderProjectBlock(entry) {
    const block = document.createElement("div");
    block.className = "project-block";

    const head = document.createElement("div");
    head.className = "project-head";
    const name = document.createElement("span");
    name.textContent = entry.project ? entry.project.title : "No project";
    head.appendChild(name);
    if (entry.project?.is_catch_all) head.appendChild(flag("catch-all"));
    if (!entry.project) head.appendChild(flag("unassigned", true));
    if (entry.project?.status === "closed") head.appendChild(flag("closed"));
    const count = document.createElement("span");
    count.className = "count";
    const open = entry.changes.filter((c) => c.status !== "done").length;
    count.textContent = `${entry.changes.length} change${entry.changes.length === 1 ? "" : "s"}`
      + (open === entry.changes.length ? "" : ` · ${open} open`);
    head.appendChild(count);
    block.appendChild(head);

    if (!entry.changes.length) {
      const empty = document.createElement("div");
      empty.className = "lens-empty";
      empty.textContent = "Nothing here yet.";
      block.appendChild(empty);
      return block;
    }
    const grid = document.createElement("div");
    grid.className = "project-changes";
    for (const change of entry.changes) grid.appendChild(itemCard(change, { showProduct: true }));
    block.appendChild(grid);
    return block;
  }

  function renderInitiativeGroup(group) {
    const section = document.createElement("section");
    section.className = "initiative-group";

    const head = document.createElement("div");
    head.className = "initiative-head";
    const title = document.createElement("h2");
    title.textContent = group.initiative ? group.initiative.title : "Unaligned";
    head.appendChild(title);
    if (group.initiative?.is_maintenance) head.appendChild(flag("always open"));
    if (group.initiative?.status === "closed") head.appendChild(flag("closed"));
    if (!group.initiative) head.appendChild(flag("no initiative", true));
    const total = group.projects.reduce((sum, p) => sum + p.changes.length, 0);
    const count = document.createElement("span");
    count.className = "count";
    const productCount = new Set(
      group.projects.flatMap((p) => p.changes.map((c) => c.product))
    ).size;
    count.textContent = `${total} change${total === 1 ? "" : "s"}`
      // Spelling out the product spread is the point of this lens: it's what the
      // per-product board structurally cannot show.
      + (productCount > 1 ? ` across ${productCount} products` : "");
    head.appendChild(count);
    section.appendChild(head);

    if (group.initiative && !group.initiative.is_unaligned) {
      const goals = document.createElement("div");
      goals.className = "initiative-goals";
      goals.textContent = `serves ${group.initiative.goal_ids.length} goal`
        + (group.initiative.goal_ids.length === 1 ? "" : "s");
      section.appendChild(goals);
    }

    for (const entry of group.projects) section.appendChild(renderProjectBlock(entry));
    return section;
  }

  function renderByInitiative() {
    const groups = groupByInitiative();
    if (!groups.length) {
      const empty = document.createElement("p");
      empty.className = "lens-empty";
      empty.innerHTML =
        'No goals, initiatives or projects yet — set them up on the '
        + '<a href="/portfolio">portfolio page</a>, and changes will group here.';
      main.appendChild(empty);
      return;
    }
    for (const group of groups) main.appendChild(renderInitiativeGroup(group));
  }

  function renderAll() {
    main.innerHTML = "";
    document.getElementById("subtitle").textContent = lens === "initiative"
      ? "Initiative → project → change · one initiative can span several products"
      : "Now / Next / Later per product · status tracked independently · cross-product suggestions flagged for triage";
    for (const button of document.querySelectorAll("#pivot-toggle button")) {
      button.classList.toggle("active", button.dataset.lens === lens);
    }
    if (lens === "initiative") {
      renderByInitiative();
      return;
    }
    for (const product of Object.keys(PRODUCTS)) {
      main.appendChild(renderProduct(product));
    }
  }

  for (const button of document.querySelectorAll("#pivot-toggle button")) {
    button.addEventListener("click", () => {
      lens = button.dataset.lens;
      localStorage.setItem("roadmapLens", lens);
      renderAll();
    });
  }

  function upsertItem(item) {
    const list = itemsByProduct[item.product] ?? (itemsByProduct[item.product] = []);
    const idx = list.findIndex((i) => i.id === item.id);
    if (idx >= 0) list[idx] = item; else list.push(item);
    renderAll();
  }

  function removeItem(product, id) {
    const list = itemsByProduct[product];
    if (!list) return;
    itemsByProduct[product] = list.filter((i) => i.id !== id);
    renderAll();
  }

  function loadBoard() {
    return fetch("/roadmap/data")
      .then((r) => r.json())
      .then((data) => {
        PRODUCTS = data.products;
        itemsByProduct = data.items;
        PORTFOLIO = data.portfolio || PORTFOLIO;
        TRACKERS = data.trackers || TRACKERS;
        renderTrackerBar();
        renderAll();
      });
  }

  // ---- tracker sync status ----

  function renderTrackerBar() {
    const bar = document.getElementById("tracker-bar");
    bar.classList.toggle("visible", !!TRACKERS.configured);
    if (!TRACKERS.configured) return;
    bar.innerHTML = "";

    for (const tracker of TRACKERS.trackers) {
      const status = tracker.status;
      const chip = document.createElement("span");
      // Three states, each explicit: synced, failed, never synced. A tracker that has
      // never run must not look the same as one holding zero tickets.
      const state = !status || (!status.ok && !status.error)
        ? "never"
        : status.error
        ? "failed"
        : "ok";
      chip.className = `tracker-chip ${state}`;

      const dot = document.createElement("span");
      dot.className = "dot";
      dot.textContent = state === "ok" ? "●" : state === "failed" ? "▲" : "○";
      chip.appendChild(dot);

      const text = document.createElement("span");
      if (!tracker.usable) {
        text.textContent = `${tracker.label} — not configured: ${tracker.unusable_reason}`;
        chip.className = "tracker-chip failed";
      } else if (state === "failed") {
        text.textContent = `${tracker.label} — sync failed: ${status.error}`;
      } else if (state === "never") {
        text.textContent = `${tracker.label} — not synced yet`;
      } else {
        const when = relativeTime(status.finished_at);
        text.textContent =
          `${tracker.label} — ${tracker.ticket_count} ticket${tracker.ticket_count === 1 ? "" : "s"}` +
          (when ? `, synced ${when}` : "") +
          (status.truncated ? " (capped — only the most recently changed were pulled)" : "");
      }
      chip.appendChild(text);
      bar.appendChild(chip);
    }

    const button = document.createElement("button");
    button.type = "button";
    button.textContent = TRACKERS.syncing ? "Syncing…" : "Sync now";
    button.disabled = !!TRACKERS.syncing;
    button.addEventListener("click", () => {
      button.disabled = true;
      button.textContent = "Syncing…";
      fetch("/trackers/sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
        .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
        .then(({ ok, body }) => {
          if (!ok) {
            button.disabled = false;
            button.textContent = "Sync now";
            alert(body.detail || "Could not start a sync.");
            return;
          }
          TRACKERS = body.trackers ? body : TRACKERS;
          // The finished state arrives on the roadmap socket as `trackers_synced`.
        })
        .catch(() => {
          button.disabled = false;
          button.textContent = "Sync now";
        });
    });
    bar.appendChild(button);
  }

  // ---- link picker ----

  const picker = document.getElementById("ticket-picker");
  const pickerInput = document.getElementById("picker-input");
  const pickerResults = document.getElementById("picker-results");
  const pickerNote = document.getElementById("picker-note");
  const pickerSub = document.getElementById("picker-sub");
  const pickerUnlink = document.getElementById("picker-unlink");
  const pickerLink = document.getElementById("picker-link");
  let pickerItem = null;
  let searchTimer = null;

  function openTicketPicker(item) {
    pickerItem = item;
    pickerInput.value = "";
    pickerNote.textContent = "";
    pickerNote.classList.remove("error");
    pickerSub.textContent = item.ticket
      ? `"${item.title}" is linked to ${item.ticket.key}. Pick another ticket to move the link, or unlink it.`
      : `Link "${item.title}" to one ticket. A ticket can belong to one change only.`;
    pickerUnlink.classList.toggle("hidden", !item.ticket);
    picker.classList.add("open");
    pickerInput.focus();
    searchTickets("");
  }

  function closeTicketPicker() {
    picker.classList.remove("open");
    pickerItem = null;
    pickerResults.innerHTML = "";
  }

  function searchTickets(query) {
    fetch(`/trackers/tickets?q=${encodeURIComponent(query)}&limit=50`)
      .then((r) => r.json())
      .then(({ tickets }) => {
        pickerResults.innerHTML = "";
        if (!tickets.length) {
          const empty = document.createElement("div");
          empty.className = "lens-empty";
          empty.textContent = TRACKERS.trackers.some((t) => t.ticket_count)
            ? "No synced ticket matches that. You can still paste a full URL or key above."
            : "Nothing synced yet — run a sync, or paste a ticket URL or key above.";
          pickerResults.appendChild(empty);
          return;
        }
        for (const ticket of tickets) {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "picker-row";
          row.appendChild(ticketBadge({ ...ticket, url: "" }));
          const title = document.createElement("span");
          title.className = "row-title";
          title.textContent = ticket.title || "(no title)";
          row.appendChild(title);
          // Already-linked tickets are shown but unpickable: seeing that PROJ-12 is taken
          // is more useful than it silently missing from the list.
          const alreadyThis = pickerItem && pickerItem.ticket && pickerItem.ticket.key === ticket.key
            && pickerItem.ticket.tracker_id === ticket.tracker_id;
          if (ticket.linked && !alreadyThis) {
            const taken = document.createElement("span");
            taken.className = "row-taken";
            taken.textContent = "linked elsewhere";
            row.appendChild(taken);
            row.disabled = true;
          } else if (alreadyThis) {
            const taken = document.createElement("span");
            taken.className = "row-taken";
            taken.textContent = "current";
            row.appendChild(taken);
          }
          row.addEventListener("click", () => submitLink({ tracker_id: ticket.tracker_id, ticket_key: ticket.key }));
          pickerResults.appendChild(row);
        }
      })
      .catch(() => {});
  }

  function submitLink(payload) {
    if (!pickerItem) return;
    pickerNote.textContent = "Linking…";
    pickerNote.classList.remove("error");
    pickerLink.disabled = true;
    fetch(`/roadmap/${pickerItem.product}/items/${pickerItem.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then(({ ok, body }) => {
        pickerLink.disabled = false;
        if (!ok) {
          // The 409 body names the change already holding the ticket, which is the whole
          // point of surfacing it here rather than just saying "conflict".
          pickerNote.textContent = body.detail || "Could not link that ticket.";
          pickerNote.classList.add("error");
          return;
        }
        closeTicketPicker();
        // The board updates itself from the roadmap websocket's upsert event.
      })
      .catch(() => {
        pickerLink.disabled = false;
        pickerNote.textContent = "Could not reach the server.";
        pickerNote.classList.add("error");
      });
  }

  pickerInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => searchTickets(pickerInput.value.trim()), 150);
  });
  pickerInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      pickerLink.click();
    }
  });
  // The typed value is sent as `ticket`, which the server resolves from a URL or a bare
  // key against the configured trackers (see _apply_ticket_link).
  pickerLink.addEventListener("click", () => {
    const raw = pickerInput.value.trim();
    if (!raw) {
      pickerNote.textContent = "Paste a ticket URL or key, or pick one from the list.";
      pickerNote.classList.add("error");
      return;
    }
    submitLink({ ticket: raw });
  });
  pickerUnlink.addEventListener("click", () => submitLink({ ticket: "" }));
  document.getElementById("picker-cancel").addEventListener("click", closeTicketPicker);
  picker.addEventListener("click", (event) => {
    if (event.target === picker) closeTicketPicker();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && picker.classList.contains("open")) closeTicketPicker();
  });

  loadBoard();

  const ws = new WebSocket(`ws://${location.host}/ws/roadmap`);
  ws.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    if (event.type === "roadmap_item_upserted") upsertItem(event.item);
    if (event.type === "roadmap_item_deleted") removeItem(event.product, event.id);
    // A project being re-parented or an initiative closing changes how this board
    // groups, but says nothing about the items themselves - so refetch rather than
    // trying to patch the work model incrementally.
    if (event.type === "portfolio_changed") loadBoard();
    // A sync finished: statuses changed, and so did every linked card's badge, so take
    // the whole board again rather than reconciling ticket-by-ticket.
    if (event.type === "trackers_synced") loadBoard();
  };
</script>
</body>
</html>
