<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PM Studio — People</title>
<link rel="stylesheet" href="/static/nav.css" />
<script src="/static/nav.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink-primary: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-fg: #ffffff;
    --error: #d03b3b;
    --ok: #0ca30c;
    --note-bg: rgba(42, 120, 214, 0.07);
    --code-bg: rgba(11, 11, 11, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19;
      --page: #0d0d0d;
      --ink-primary: #ffffff;
      --ink-secondary: #c3c2b7;
      --ink-muted: #898781;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
      --error: #e66767;
      --ok: #2fce2f;
      --note-bg: rgba(57, 135, 229, 0.12);
      --code-bg: rgba(255, 255, 255, 0.07);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 { font-size: 1.2em; margin: 0; }
  header a { color: var(--accent); text-decoration: none; font-size: 0.85em; }
  main { padding: 24px; max-width: 900px; }
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  h2 { font-size: 0.95em; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--ink-muted); font-size: 0.83em; line-height: 1.5; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
  th {
    text-align: left;
    font-weight: 500;
    font-size: 0.82em;
    color: var(--ink-muted);
    padding: 0 10px 8px 0;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .email { color: var(--ink-secondary); font-size: 0.92em; }
  select, input {
    padding: 6px 8px;
    font-size: 0.9em;
    font-family: inherit;
    color: var(--ink-primary);
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  button {
    padding: 7px 12px;
    font-size: 0.88em;
    font-family: inherit;
    color: var(--accent-fg);
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button.ghost {
    color: var(--ink-secondary);
    background: transparent;
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.5; cursor: default; }
  form.invite { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  form.invite input { flex: 1 1 220px; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    font-size: 0.78em;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--ink-secondary);
  }
  .badge.disabled { color: var(--ink-muted); }
  .badge.invited { color: var(--accent); border-color: var(--accent); }
  .error, .ok {
    margin: 0 0 14px;
    padding: 9px 11px;
    font-size: 0.85em;
    border-radius: 7px;
    display: none;
  }
  .error { color: var(--error); border: 1px solid var(--error); }
  .ok { color: var(--ink-secondary); background: var(--note-bg); }
  .link-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
  }
  code {
    flex: 1;
    padding: 8px 10px;
    font-size: 0.82em;
    background: var(--code-bg);
    border-radius: 6px;
    word-break: break-all;
  }
  .empty { color: var(--ink-muted); font-size: 0.88em; }
</style>
</head>
<body>
<div id="pm-nav" data-page="people"></div>
<header>
  <h1>People</h1>
</header>
<main>
  <p class="error" id="error"></p>
  <p class="ok" id="ok"></p>

  <section>
    <h2>Invite someone</h2>
    <p class="sub" id="invite-sub">Invites are sent by email when SMTP is configured; otherwise you get a link to share.</p>
    <form class="invite" id="invite-form">
      <input id="invite-email" type="email" placeholder="name@example.com" required />
      <select id="invite-role"></select>
      <button type="submit" id="invite-submit">Send invite</button>
    </form>
    <div class="link-row" id="link-row" style="display: none;">
      <code id="invite-link"></code>
      <button class="ghost" id="copy-link">Copy</button>
    </div>
  </section>

  <section>
    <h2>Team</h2>
    <p class="sub">Roles decide what someone can do. Only admins see this page or any cost data.</p>
    <table>
      <thead>
        <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="users"></tbody>
    </table>
  </section>

  <section>
    <h2>Open invites</h2>
    <p class="sub">Not yet accepted. Revoking one makes its link stop working.</p>
    <div id="invites"></div>
  </section>
</main>
<script>
  let me = null;
  let roles = {};

  const errorBox = document.getElementById("error");
  const okBox = document.getElementById("ok");

  function flash(box, message) {
    box.textContent = message;
    box.style.display = "block";
    setTimeout(() => { box.style.display = "none"; }, 6000);
  }

  async function api(path, options) {
    const response = await fetch(path, options);
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.detail || `Request failed (${response.status})`);
    }
    return response.status === 204 ? null : response.json();
  }

  function roleSelect(current, onChange, disabled) {
    const select = document.createElement("select");
    Object.entries(roles).forEach(([value, label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      if (value === current) option.selected = true;
      select.appendChild(option);
    });
    select.disabled = !!disabled;
    select.addEventListener("change", () => onChange(select.value));
    return select;
  }

  async function renderUsers() {
    const users = await api("/users");
    const body = document.getElementById("users");
    body.innerHTML = "";
    users.forEach((user) => {
      const row = document.createElement("tr");

      const name = document.createElement("td");
      name.textContent = user.name || "—";
      row.appendChild(name);

      const email = document.createElement("td");
      email.className = "email";
      email.textContent = user.email;
      row.appendChild(email);

      const role = document.createElement("td");
      // Your own role stays read-only: an admin demoting themselves by accident is a
      // lockout, and the server refuses it for the last admin anyway.
      const isSelf = me && user.id === me.id;
      role.appendChild(roleSelect(user.role, async (value) => {
        try {
          await api(`/users/${user.id}/role`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ role: value }),
          });
          flash(okBox, `${user.email} is now ${roles[value]}.`);
        } catch (err) {
          flash(errorBox, err.message);
        }
        refresh();
      }, isSelf));
      row.appendChild(role);

      const status = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = `badge ${user.status}`;
      badge.textContent = user.status;
      status.appendChild(badge);
      row.appendChild(status);

      const actions = document.createElement("td");
      if (!isSelf) {
        const button = document.createElement("button");
        button.className = "ghost";
        const disable = user.status !== "disabled";
        button.textContent = disable ? "Disable" : "Enable";
        button.addEventListener("click", async () => {
          try {
            await api(`/users/${user.id}/status`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ status: disable ? "disabled" : "active" }),
            });
          } catch (err) {
            flash(errorBox, err.message);
          }
          refresh();
        });
        actions.appendChild(button);
      }
      row.appendChild(actions);

      body.appendChild(row);
    });
  }

  async function renderInvites() {
    const invites = await api("/invites");
    const container = document.getElementById("invites");
    container.innerHTML = "";
    if (!invites.length) {
      container.innerHTML = '<p class="empty">No open invites.</p>';
      return;
    }
    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>Email</th><th>Role</th><th></th></tr></thead>";
    const body = document.createElement("tbody");
    invites.forEach((invite) => {
      const row = document.createElement("tr");
      const email = document.createElement("td");
      email.className = "email";
      email.textContent = invite.email;
      row.appendChild(email);
      const role = document.createElement("td");
      role.textContent = invite.role_label;
      row.appendChild(role);
      const actions = document.createElement("td");
      const button = document.createElement("button");
      button.className = "ghost";
      button.textContent = "Revoke";
      button.addEventListener("click", async () => {
        try {
          await api(`/invites/${invite.id}`, { method: "DELETE" });
        } catch (err) {
          flash(errorBox, err.message);
        }
        refresh();
      });
      actions.appendChild(button);
      row.appendChild(actions);
      body.appendChild(row);
    });
    table.appendChild(body);
    container.appendChild(table);
  }

  document.getElementById("invite-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const submit = document.getElementById("invite-submit");
    submit.disabled = true;
    try {
      const result = await api("/invites", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("invite-email").value,
          role: document.getElementById("invite-role").value,
        }),
      });
      document.getElementById("invite-email").value = "";
      document.getElementById("invite-link").textContent = result.accept_url;
      document.getElementById("link-row").style.display = "flex";
      flash(okBox, result.emailed
        ? `Invite emailed to ${result.invite.email}.`
        : `Invite created — share this link with ${result.invite.email}.`);
      refresh();
    } catch (err) {
      flash(errorBox, err.message);
    }
    submit.disabled = false;
  });

  document.getElementById("copy-link").addEventListener("click", async () => {
    const link = document.getElementById("invite-link").textContent;
    try {
      await navigator.clipboard.writeText(link);
      flash(okBox, "Link copied.");
    } catch (err) {
      flash(errorBox, "Could not copy — select the link and copy it manually.");
    }
  });

  async function refresh() {
    try {
      await renderUsers();
      await renderInvites();
    } catch (err) {
      flash(errorBox, err.message);
    }
  }

  async function init() {
    // The shared nav already fetched this to decide which tabs to show; reuse its
    // promise so the page makes one /auth/me rather than two.
    const info = (await PMNav.auth) || {};
    me = info.user;
    roles = info.roles || {};
    const select = document.getElementById("invite-role");
    Object.entries(roles).forEach(([value, label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      if (value === "viewer") option.selected = true;
      select.appendChild(option);
    });
    if (!info.smtp_configured) {
      document.getElementById("invite-sub").textContent =
        "No mail server is configured, so each invite gives you a link to share instead.";
    }
    refresh();
  }

  init();
</script>
</body>
</html>
