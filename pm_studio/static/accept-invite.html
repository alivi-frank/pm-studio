<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PM Studio — Accept invite</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink-primary: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-fg: #ffffff;
    --error: #d03b3b;
    --note-bg: rgba(42, 120, 214, 0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19;
      --page: #0d0d0d;
      --ink-primary: #ffffff;
      --ink-secondary: #c3c2b7;
      --ink-muted: #898781;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
      --error: #e66767;
      --note-bg: rgba(57, 135, 229, 0.12);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--page);
    color: var(--ink-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  h1 { font-size: 1.15em; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--ink-muted); font-size: 0.88em; line-height: 1.5; }
  .note {
    margin: 0 0 20px;
    padding: 11px 13px;
    font-size: 0.85em;
    color: var(--ink-secondary);
    background: var(--note-bg);
    border-radius: 8px;
  }
  .note strong { color: var(--ink-primary); }
  label { display: block; font-size: 0.82em; color: var(--ink-secondary); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 9px 11px;
    margin-bottom: 16px;
    font-size: 0.95em;
    font-family: inherit;
    color: var(--ink-primary);
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 7px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hint { margin: -10px 0 16px; font-size: 0.78em; color: var(--ink-muted); }
  button {
    width: 100%;
    padding: 10px;
    font-size: 0.95em;
    font-family: inherit;
    font-weight: 500;
    color: var(--accent-fg);
    background: var(--accent);
    border: 0;
    border-radius: 7px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    margin: 0 0 16px;
    padding: 9px 11px;
    font-size: 0.85em;
    color: var(--error);
    border: 1px solid var(--error);
    border-radius: 7px;
    display: none;
  }
  #form { display: none; }
</style>
</head>
<body>
<main>
  <h1>Accept your invite</h1>
  <p class="sub" id="sub">Checking your invite…</p>
  <div class="note" id="whoami" style="display: none;"></div>
  <p class="error" id="error"></p>
  <form id="form">
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" autocomplete="name" required />
    <label for="password">Choose a password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required />
    <p class="hint">At least 10 characters.</p>
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />
    <button type="submit" id="submit">Set password and sign in</button>
  </form>
</main>
<script>
  const token = new URLSearchParams(window.location.search).get("token") || "";
  const form = document.getElementById("form");
  const errorBox = document.getElementById("error");
  const submit = document.getElementById("submit");
  const sub = document.getElementById("sub");
  const whoami = document.getElementById("whoami");

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  async function load() {
    if (!token) {
      sub.textContent = "This link is missing its invite token.";
      return;
    }
    const response = await fetch(`/auth/invite?token=${encodeURIComponent(token)}`);
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      sub.textContent = data.detail || "This invite link is not valid.";
      return;
    }
    const invite = await response.json();
    sub.textContent = "Set a password to finish joining.";
    whoami.innerHTML = `Invited as <strong>${invite.email}</strong> — ${invite.role_label}`;
    whoami.style.display = "block";
    form.style.display = "block";
    document.getElementById("name").focus();
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorBox.style.display = "none";
    const password = document.getElementById("password").value;
    if (password !== document.getElementById("confirm").value) {
      showError("The two passwords don't match.");
      return;
    }
    submit.disabled = true;
    try {
      const response = await fetch("/auth/accept-invite", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          token: token,
          name: document.getElementById("name").value,
          password: password,
        }),
      });
      if (response.ok) {
        window.location.href = "/";
        return;
      }
      const data = await response.json().catch(() => ({}));
      showError(data.detail || "Could not accept the invite.");
    } catch (err) {
      showError("Could not reach the server.");
    }
    submit.disabled = false;
  });

  load();
</script>
</body>
</html>
